name: Book Chapter
type: book_chapter
threshold: 0.6
predicates:
  - kind: page_count_in_range
    min: 20
    max: 200
    weight: 0.3

  - kind: heading_depth_at_least
    depth: 1
    weight: 0.2

  - kind: font_diversity_in_range
    min: 1
    max: 3
    weight: 0.15

  - kind: text_contains
    pattern: chapter
    weight: 0.15
    case_sensitive: false
    min_hits: 1

  - kind: text_contains
    pattern: chapter
    weight: 0.1
    case_sensitive: false
    min_hits: 1

  - kind: has_footer_page_numbers
    weight: 0.1
