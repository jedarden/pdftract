name: Point of Sale Receipt
type: receipt
threshold: 0.6
predicates:
  - kind: text_contains
    pattern: receipt
    weight: 0.35
    case_sensitive: false
    min_hits: 1

  - kind: text_matches_regex
    pattern: '[\$€£¥]\d'
    weight: 0.25
    min_hits: 2

  - kind: font_diversity_in_range
    min: 1
    max: 2
    weight: 0.15

  - kind: page_count_in_range
    min: 1
    max: 1
    weight: 0.15

  - kind: text_contains
    pattern: total
    weight: 0.1
    case_sensitive: false
    min_hits: 1
