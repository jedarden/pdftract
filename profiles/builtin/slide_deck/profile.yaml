description: Presentation slides with title, presenter, date, slide titles
priority: 35
match:
  any:
    - structural:
        - page_aspect_ratio: "landscape"
        - page_count_gte: 3
        - has_large_centred_text: true
    - text_patterns:
        - "(?i)presentation"
        - "(?i)slide\\s+[0-9]+"
        - "(?i)table\\s+of\\s+contents"
  page_count_hint: 3-200
profile_fields:
  title:
    type: string
    extraction:
      region_hint: "first_page_centre"
      patterns:
        - "^(.+)$"
      fallback: null
  presenter:
    type: string
    extraction:
      region_hint: "first_page_below_title"
      patterns:
        - "([A-Z][a-z]+\\s+[A-Z][a-z]+)"
        - "([A-Z]\\.[A-Z]\\.[A-Za-z]+)"
      fallback: null
  date:
    type: date
    extraction:
      region_hint: "first_page_bottom"
      patterns:
        - "([A-Za-z]+\\s+[0-9]{1,2},?\\s+[0-9]{4})"
        - "([0-9]{1,2}[/-][0-9]{1,2}[/-][0-9]{2,4})"
      fallback: null
  slide_titles:
    type: array
    extraction:
      per_page: true
      region_hint: "top_left_or_centre"
      patterns:
        - "^[A-Z][A-Za-z0-9\\s\\-:]+$"
      fallback: []
reading_order: line_dominant
zone_filtering: none
