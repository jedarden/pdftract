[package]
name = "pdftract-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[dependencies]
anyhow = { workspace = true }
hex = "0.4"
image = { version = "0.25", optional = true }
leptonica-plumbing = { version = "1.4", optional = true }
pdfium-render = { version = "0.9", optional = true }
indexmap = "2.2"
flate2 = { workspace = true }
lzw = { workspace = true }
regex = "1.10"
secrecy = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sha2 = "0.10"
thiserror = { workspace = true }
memchr = { workspace = true }
unicode-normalization = { workspace = true }
ttf-parser = "0.24"
owned_ttf_parser = "0.21"
zstd = "0.13"
rayon = "1.10"
phf = "0.11"
tracing = { workspace = true }
dashmap = "6.1"
smallvec = "1.13"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]
receipts = []  # Enable visual citation receipts (SVG clip generation)
ocr = ["dep:image", "dep:leptonica-plumbing"]  # Enable OCR path (image compositing + preprocessing)
full-render = ["dep:pdfium-render", "ocr"]  # Enable PDFium-based rendering (requires ocr)
proptest = []
fuzzing = []  # Enable cfg(fuzzing) for fuzz harnesses
shape-db = []  # Enable glyph shape database (Level 4 encoding fallback)
cjk = []  # Enable CJK text extraction via predefined CMap registry (~1.2 MB binary size increase)

[dev-dependencies]
chrono = "0.4"
criterion = "0.5"
proptest = "1.4"
quick-xml = "0.36"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
filetime = "0.2"

[[bench]]
name = "table_detection"
harness = false

[build-dependencies]
phf_codegen = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
