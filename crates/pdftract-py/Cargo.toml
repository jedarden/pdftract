[package]
name = "pdftract-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "pdftract_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
pdftract-core = { path = "../pdftract-core" }
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py310"] }
pythonize = "0.20"
secrecy = "0.10"

[features]
default = ["pyo3/extension-module"]

[dev-dependencies]
# Used by tests/test_search_integration.rs to parse the JSON report of the
# python driver subprocess that exercises pdftract.search() end to end.
serde_json = "1"
