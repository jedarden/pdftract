[workspace]
resolver = "2"
members = ["crates/pdftract-core", "crates/pdftract-cer-diff", "crates/pdftract-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jedarden/pdftract"

[workspace.dependencies]
# Dependencies shared across workspace crates
flate2 = "1.0"
thiserror = "1.0"
secrecy = "0.8"
