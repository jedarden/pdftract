[workspace]

[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[[bin]]
name = "gen_schema"
path = "src/bin/gen_schema.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
glob = "0.3"
humantime = "2.1"
lopdf = "0.34"
schemars = "1.2"
pdftract-core = { path = "../crates/pdftract-core", features = ["schemars"] }
