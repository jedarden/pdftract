# pdftract-nightly-fuzz CronWorkflow
#
# Nightly fuzzing job for pdftract using cargo-fuzz with libFuzzer.
# Runs eight fuzz targets (~4.8h each, with two concurrent runs), seeded
# from malformed fixtures and checked-in per-target seeds
# (fuzz/seeds/<target>/).
# Crash summaries are logged for follow-up triage.
#
# === Schedule ===
# Runs daily at 04:00 UTC via cron: "0 4 * * *"
#
# === Fuzz Targets ===
# - lexer: Tokenization INV-8 invariant (no panic at public boundary)
# - object_parser: Direct/indirect object parsing
# - xref: Cross-reference table parsing (EC-07 corrupt xref, EC-08 circular refs)
# - stream_decoder: Decompression filters (EC-10 decompression bomb)
# - lzw_decode: LZWDecode /DecodeParms space (/EarlyChange, TIFF+PNG
#   predictors) - ADR-003 compensating control for RUSTSEC-2020-0144
# - cmap_parser: CMap name and string handling
#
# === Resource Budget ===
# 8 targets x 4.8h = ~38 target-hours, approximately 20h at parallelism 2
# Time limit per target: 6 hours (allows some overlap)
#
# === Crash Handling ===
# - Crash tarballs are collected on the per-run workspace for reporting.
# - Durable artifacts and terminal evidence are handled by the evidence work.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: pdftract-nightly-fuzz
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: pdftract-nightly-fuzz
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: pdftract
spec:
  schedules:
    - "0 4 * * *"  # Daily at 04:00 UTC
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  workflowMetadata:
    labels:
      app.kubernetes.io/name: pdftract-nightly-fuzz
      workflow-type: nightly-fuzz
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: argo-workflow
    parallelism: 2  # Shared ReadWriteOnce PVCs keep the run on one node.

    # === Workflow Timeout Structure ===
    # Multi-layer timeout protection to prevent indefinite hangs:
    #
    # 1. Workflow-level deadline (86400s = 24 hours):
    #    - Measured from workflow.status.startedAt (creation time)
    #    - Kills the entire workflow if it exceeds this time
    #    - Independent of pod scheduling status
    #    - Guard against PVC provisioning failures and controller bugs
    #
    # 2. Template-level deadlines:
    #    - setup: 600s (10 min) - cargo-fuzz installation
    #    - seed-corpus: 300s (5 min) - corpus preparation
    #    - fuzz-target: 21600s (6 hours) - per-target fuzzing
    #    - report-crashes: 300s (5 min) - crash summary
    #
    # 3. Command-level timeouts (in-container):
    #    - cargo install cargo-fuzz: 300s timeout
    #    - cargo fuzz run: governed by timeout parameter (17400s = 4.8h)
    #
    # FIX (bf-1toqu8): Added command-level timeout to cargo-fuzz installation
    # to prevent hangs on network issues or build problems. Fixed storage
    # classes (sata-large -> sata for <100Gi volumes). Adjusted workflow
    # deadline from 24h to match actual runtime.
    activeDeadlineSeconds: 86400  # 24 hours absolute max
    podGC:
      strategy: OnWorkflowCompletion
    ttlStrategy:
      secondsAfterSuccess: 43200   # 12 hours for success
      secondsAfterFailure: 604800  # 7 days for failure

    volumeClaimTemplates:
      - metadata:
          name: cargo-cache
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: sata-large
          resources:
            requests:
              storage: 100Gi  # Fuzzing generates lots of artifacts
      - metadata:
          name: workspace
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: sata
          resources:
            requests:
              storage: 10Gi
      - metadata:
          name: fuzz-artifacts
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: sata
          resources:
            requests:
              storage: 20Gi

    volumes:
      - name: docker-config
        secret:
          secretName: docker-hub-registry
          items:
            - key: .dockerconfigjson
              path: config.json

    podMetadata:
      labels:
        app.kubernetes.io/name: pdftract-nightly-fuzz
        workflow-type: nightly-fuzz

    podSpecPatch: |
      imagePullSecrets:
        - name: docker-hub-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

    templates:
      # === Top-level DAG ===
      # Clone workspace, then run all fuzz targets in parallel
      - name: pipeline
        dag:
          tasks:
            - name: setup
              template: setup

            - name: seed-corpus
              template: seed-corpus
              dependencies: [setup]

            - name: fuzz-matrix
              template: fuzz-matrix
              dependencies: [setup, seed-corpus]
              continueOn:
                failed: true
                error: true

            - name: report-crashes
              template: report-crashes
              dependencies: [fuzz-matrix]

      # === Setup Step ===
      # Clone repo and install cargo-fuzz
      # FIX (bf-1toqu8): Added command-level timeouts to prevent hangs
      # on cargo install and network operations
      - name: setup
        activeDeadlineSeconds: 600
        container:
          image: rustlang/rust:nightly-bookworm@sha256:b9312379e56f5e8ce6c5b0608876b0b29b36482e2dba6aff68392f7657fabc94
          command: [bash, -c]
          args:
            - |
              set -eo pipefail

              echo "=== Nightly Fuzz Setup ==="

              git clone --depth 1 --branch main \
                https://git.ardenone.com/jedarden/pdftract.git /workspace/pdftract
              cd /workspace/pdftract
              export CARGO_HOME="/cache/cargo/registry"
              export PATH="$CARGO_HOME/bin:$PATH"

              # Install cargo-fuzz if not present with timeout
              if ! command -v cargo-fuzz &> /dev/null; then
                echo "Installing cargo-fuzz..."
                # Add timeout to prevent indefinite hangs on network issues
                timeout 300 cargo install cargo-fuzz --locked || {
                  echo "ERROR: cargo-fuzz installation failed (timeout or build error)"
                  exit 1
                }
              fi

              echo "cargo-fuzz installed:"
              cargo-fuzz --version

              echo "=== Setup complete ==="
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: cargo-cache
              mountPath: /cache/cargo
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi

      # === Seed Corpus ===
      # Populate fuzz corpus from tests/fixtures/malformed/
      - name: seed-corpus
        activeDeadlineSeconds: 300
        container:
          image: alpine:3.19
          command: [sh, -c]
          args:
            - |
              set -e

              echo "=== Seeding Fuzz Corpus ==="

              MALFORMED_DIR="/workspace/pdftract/tests/fixtures/malformed"
              CORPUS_BASE="/workspace/pdftract/fuzz/corpus"

              # Check if malformed fixtures exist
              if [ ! -d "$MALFORMED_DIR" ]; then
                echo "WARNING: No malformed fixtures found at $MALFORMED_DIR"
                exit 0
              fi

              echo "Found $(ls -1 "$MALFORMED_DIR" | wc -l) malformed fixtures"

              # Seed each fuzz target corpus with relevant fixtures
              # All targets get basic malformed PDFs for general robustness
              # Checked-in curated seeds (fuzz/seeds/<target>/, e.g. the real
              # LZW streams for lzw_decode per ADR-003) are copied on top so
              # they are always present regardless of fixture churn.
              SEEDS_DIR="/workspace/pdftract/fuzz/seeds"
              for target in lexer object_parser xref stream_decoder lzw_decode cmap_parser content profile_yaml; do
                TARGET_CORPUS="$CORPUS_BASE/$target"
                mkdir -p "$TARGET_CORPUS"

                echo "Seeding $target corpus..."
                for fixture in "$MALFORMED_DIR"/*; do
                  if [ -f "$fixture" ]; then
                    cp "$fixture" "$TARGET_CORPUS/"
                  fi
                done

                if [ -d "$SEEDS_DIR/$target" ]; then
                  cp "$SEEDS_DIR/$target"/* "$TARGET_CORPUS/" 2>/dev/null || true
                fi

                echo "  $target corpus: $(ls -1 "$TARGET_CORPUS" | wc -l) files"
              done

              echo "=== Corpus seeding complete ==="
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      # === Fuzz Matrix ===
      # Run all eight fuzz targets, at most two at a time.
      - name: fuzz-matrix
        dag:
          failFast: false
          tasks:
            - name: fuzz-lexer
              template: fuzz-target
              arguments:
                parameters:
                  - name: target
                    value: "lexer"
                  - name: timeout
                    value: "17400"  # 4.8 hours in seconds
              continueOn:
                failed: true
                error: true  # Continue even if one target fails
            - name: fuzz-object-parser
              template: fuzz-target
              arguments:
                parameters:
                  - name: target
                    value: "object_parser"
                  - name: timeout
                    value: "17400"
              continueOn:
                failed: true
                error: true
            - name: fuzz-xref
              template: fuzz-target
              arguments:
                parameters:
                  - name: target
                    value: "xref"
                  - name: timeout
                    value: "17400"
              continueOn:
                failed: true
                error: true
            - name: fuzz-stream-decoder
              template: fuzz-target
              arguments:
                parameters:
                  - name: target
                    value: "stream_decoder"
                  - name: timeout
                    value: "17400"
              continueOn:
                failed: true
                error: true
            - name: fuzz-cmap-parser
              template: fuzz-target
              arguments:
                parameters:
                  - name: target
                    value: "cmap_parser"
                  - name: timeout
                    value: "17400"
              continueOn:
                failed: true
                error: true
            - name: fuzz-content
              template: fuzz-target
              arguments:
                parameters:
                  - name: target
                    value: "content"
                  - name: timeout
                    value: "17400"
              continueOn:
                failed: true
                error: true
            - name: fuzz-profile-yaml
              template: fuzz-target
              arguments:
                parameters:
                  - name: target
                    value: "profile_yaml"
                  - name: timeout
                    value: "17400"
              continueOn:
                failed: true
                error: true
            - name: fuzz-lzw-decode
              template: fuzz-target
              arguments:
                parameters:
                  - name: target
                    value: "lzw_decode"
                  - name: timeout
                    value: "17400"
              continueOn:
                failed: true
                error: true
            - name: fuzz-matrix-exit
              template: fuzz-matrix-exit
              dependencies: [fuzz-lexer, fuzz-object-parser, fuzz-xref, fuzz-stream-decoder, fuzz-cmap-parser, fuzz-content, fuzz-profile-yaml, fuzz-lzw-decode]

      # === Fuzz Target Template ===
      # Run cargo-fuzz on a single target with address sanitizer
      #
      # Kubernetes memory limits bound each pod; libFuzzer also limits RSS and
      # allocations. Unprivileged pods cannot create child cgroups.
      - name: fuzz-target
        inputs:
          parameters:
            - name: target
            - name: timeout
        activeDeadlineSeconds: 21600  # 6 hours absolute max
        container:
          image: rustlang/rust:nightly-bookworm@sha256:b9312379e56f5e8ce6c5b0608876b0b29b36482e2dba6aff68392f7657fabc94
          command: [bash, -c]
          args:
            - |
              set -eo pipefail

              TARGET="{{inputs.parameters.target}}"
              TIMEOUT="{{inputs.parameters.timeout}}"
              ARTIFACT_DIR="/fuzz-artifacts/$TARGET"

              echo "=========================================="
              echo "Fuzzing Target: $TARGET"
              echo "Timeout: $TIMEOUT seconds"
              echo "=========================================="

              cd /workspace/pdftract
              export CARGO_HOME="/cache/cargo/registry"
              export CARGO_TARGET_DIR="/cache/cargo/target-fuzz-$TARGET"
              export PATH="$CARGO_HOME/bin:$PATH"

              # cargo-fuzz enables the address sanitizer for the target.
              export ASAN_OPTIONS="detect_leaks=0:symbolize=1"

              # Create artifact directory
              mkdir -p "$ARTIFACT_DIR"

              echo "=== Building fuzz harness for $TARGET ==="
              cargo fuzz build "$TARGET"

              echo "=== Starting fuzz run for $TARGET (max $TIMEOUT seconds) ==="
              echo "Corpus: fuzz/corpus/$TARGET"
              echo "Artifacts: $ARTIFACT_DIR"
              echo "Memory limits: Kubernetes pod limit, libFuzzer RSS/malloc 1024 MB"

              # Keep libFuzzer flags after -- so cargo-fuzz forwards them.
              set +e
              timeout "$((TIMEOUT + 300))" cargo fuzz run "$TARGET" -s address -- \
                "fuzz/corpus/$TARGET" \
                -timeout=10 \
                -max_total_time="$TIMEOUT" \
                -max_len=10000 \
                -rss_limit_mb=1024 \
                -malloc_limit_mb=1024 \
                -artifact_prefix="$ARTIFACT_DIR/"
              FUZZ_STATUS=$?
              set -e

              echo "=== Fuzz run complete for $TARGET ==="

              # Check for crashes
              CRASH_COUNT=$(find "$ARTIFACT_DIR" -name "crash-*" 2>/dev/null | wc -l)
              LEAK_COUNT=$(find "$ARTIFACT_DIR" -name "leak-*" 2>/dev/null | wc -l)
              TIMEOUT_COUNT=$(find "$ARTIFACT_DIR" -name "timeout-*" 2>/dev/null | wc -l)

              echo "Crashes: $CRASH_COUNT"
              echo "Leaks: $LEAK_COUNT"
              echo "Timeouts: $TIMEOUT_COUNT"

              # Package crash artifacts
              if [ "$CRASH_COUNT" -gt 0 ] || [ "$LEAK_COUNT" -gt 0 ] || [ "$TIMEOUT_COUNT" -gt 0 ]; then
                echo "=== Packaging artifacts ==="
                cd "$ARTIFACT_DIR"
                tar -czf "/workspace/crashes-$TARGET.tar.gz" \
                  crash-* leak-* timeout-* 2>/dev/null || true
                echo "Created /workspace/crashes-$TARGET.tar.gz"

                # List artifacts for reporting
                ls -la "$ARTIFACT_DIR" | head -20
              else
                echo "No crash artifacts to package"
              fi

              # Write summary
              cat > "/workspace/summary-$TARGET.txt" <<EOF
              Target: $TARGET
              Duration: $(grep "Fuzzing for" /tmp/fuzz-stats-$TARGET.txt 2>/dev/null || echo "unknown")
              Crashes: $CRASH_COUNT
              Leaks: $LEAK_COUNT
              Timeouts: $TIMEOUT_COUNT
              EOF

              exit "$FUZZ_STATUS"

          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: cargo-cache
              mountPath: /cache/cargo
            - name: fuzz-artifacts
              mountPath: /fuzz-artifacts
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          env:
            - name: RUST_BACKTRACE
              value: "1"

      # === Fuzz Matrix Exit Handler ===
      # Count total crashes across all targets
      - name: fuzz-matrix-exit
        activeDeadlineSeconds: 300
        script:
          image: alpine:3.19
          command: [sh]
          source: |
            #!/bin/sh
            set -e

            echo "=== Fuzz Matrix Exit Report ==="

            TOTAL_CRASHES=0

            for target in lexer object_parser xref stream_decoder lzw_decode cmap_parser content profile_yaml; do
              CRASH_FILE="/workspace/crashes-$target.tar.gz"
              if [ -f "$CRASH_FILE" ]; then
                echo "Found crash artifacts: $target"
                TOTAL_CRASHES=$((TOTAL_CRASHES + 1))
              fi
            done

            echo "Total targets with crashes: $TOTAL_CRASHES"

          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      # === Report Crashes ===
      # Log the collected crash artifacts for triage.
      - name: report-crashes
        activeDeadlineSeconds: 300
        container:
          image: debian:12
          command: [bash, -c]
          args:
            - |
              set -eo pipefail

              echo "=== Processing Crash Artifacts ==="

              # Durable artifact retention is handled by the evidence work.

              for target in lexer object_parser xref stream_decoder lzw_decode cmap_parser content profile_yaml; do
                CRASH_FILE="/workspace/crashes-$target.tar.gz"
                if [ -f "$CRASH_FILE" ]; then
                  echo "=== $target crashes ==="
                  tar -tzf "$CRASH_FILE" | head -10
                  echo ""
                fi
              done

              echo "=== Crash processing complete ==="
              echo "Crash tarballs remain on the per-run workspace"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
