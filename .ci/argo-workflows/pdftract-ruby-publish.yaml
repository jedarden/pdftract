# pdftract-ruby-publish WorkflowTemplate
#
# Publishes the Ruby SDK to RubyGems (gem name: pdftract).
# Triggered by the pdftract-release-cascade after pdftract-build-binaries completes.
# The workflow clones the Ruby SDK repo, syncs the version, runs conformance
# tests, builds the gem, and pushes it to RubyGems.
#
# === Parameter Reference ===
# - tag: Git tag from the main repo (e.g., v1.0.0)
# - version: SemVer version string (e.g., 1.0.0)
#
# === Steps ===
# 1. clone-sdk-repo: Clone github.com/jedarden/pdftract-ruby
# 2. sync-version: Update pdftract.gemspec version to match the tag
# 3. bundle-install: Install Ruby dependencies
# 4. lint-ruby-visibility: Static visibility-keyword lint (fast pre-filter, bf-1uhnlv)
# 5. conformance: Run rake test:conformance (must pass to publish)
# 6. build: Build the gem with gem build
# 7. publish: Push gem to RubyGems using API key
#
# === Re-runnability ===
# A re-run after a partial failure will detect if the gem version already exists
# on RubyGems and skip the push (idempotent). The workflow is safe to re-run.
#
# Bead: pdftract-45vo7
# Plan section: SDK Architecture / Per-SDK Release Channels, line 3575 (Ruby v1.1+)
# ADR-009: Argo Workflows on iad-ci only
#
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pdftract-ruby-publish
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: pdftract-ruby-publish
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: pdftract
spec:
  # Backstop against a run that hangs before its pod ever starts (unbound
  # PVC, unschedulable, missing secret). Per-step activeDeadlineSeconds does
  # not cover that case: on 2026-08-07 five needle-ci runs sat Running for
  # 8h against a 3600s step limit. ttlStrategy only reaps COMPLETED runs, so
  # without a workflow-level cap they are never terminated and never GCd.
  # Basis: sum of per-step deadlines x attempts = 3120s, +50% headroom.
  activeDeadlineSeconds: 7200
  entrypoint: publish-ruby-sdk
  serviceAccountName: argo-workflow

  podGC:
    strategy: OnPodCompletion

  ttlStrategy:
    secondsAfterSuccess: 1800
    secondsAfterFailure: 7200

  arguments:
    parameters:
      - name: tag
        value: ""
        description: "Git tag from main repo (e.g., v1.0.0)"
      - name: version
        value: ""
        description: "Version extracted from tag (e.g., 1.0.0)"

  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sata-large
        resources:
          requests:
            storage: 5Gi

  podMetadata:
    labels:
      app.kubernetes.io/name: pdftract-ruby-publish
      tag: "{{workflow.parameters.tag}}"

  templates:
    # === Main DAG ===
    # Orchestrates the Ruby SDK publish steps
    - name: publish-ruby-sdk
      dag:
        tasks:
          - name: clone-sdk-repo
            template: clone-sdk-repo

          - name: sync-version
            template: sync-version
            dependencies: [clone-sdk-repo]

          - name: bundle-install
            template: bundle-install
            dependencies: [sync-version]

          - name: lint-ruby-visibility
            template: lint-ruby-visibility
            dependencies: [bundle-install]

          - name: conformance
            template: conformance
            dependencies: [lint-ruby-visibility]

          - name: build
            template: build
            dependencies: [conformance]

          - name: publish
            template: publish
            dependencies: [build]

    # === Clone SDK Repo ===
    # Clones the pdftract-ruby repository from GitHub
    - name: clone-sdk-repo
      activeDeadlineSeconds: 300
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            set -e
            apk add --no-cache git

            echo "Cloning pdftract-ruby repository..."
            git clone --branch main \
              "https://github.com/jedarden/pdftract-ruby.git" \
              /workspace/sdk-ruby

            cd /workspace/sdk-ruby
            echo "Cloned commit: $(git rev-parse HEAD)"
            echo "Branch: $(git branch --show-current)"
        env:
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=x-access-token" && echo "password=$GH_TOKEN"; }; f'
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-pat-pdftract
                key: token
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi

    # === Sync Version ===
    # Updates pdftract.gemspec to match the binary tag version.
    - name: sync-version
      activeDeadlineSeconds: 120
      container:
        image: ruby:3.2-slim
        command: [sh, -c]
        args:
          - |
            set -e
            VERSION="{{workflow.parameters.version}}"

            cd /workspace/sdk-ruby

            echo "Syncing gem version to ${VERSION}"

            # Update the version in pdftract.gemspec
            sed -i "s/spec.version       = .*/spec.version       = \"${VERSION}\"/" pdftract.gemspec

            # Update the version in lib/pdftract.rb
            sed -i "s/VERSION = '.*'/VERSION = '${VERSION}'/" lib/pdftract.rb

            echo "Version updated to: $(grep 'spec.version' pdftract.gemspec | awk -F'"' '{print $2}')"

            # Show the diff
            git diff
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

    # === Bundle Install ===
    # Installs Ruby dependencies using bundler.
    - name: bundle-install
      activeDeadlineSeconds: 600
      container:
        image: ruby:3.2-slim
        command: [sh, -c]
        args:
          - |
            set -e

            cd /workspace/sdk-ruby

            echo "Installing gem dependencies..."
            gem install bundler
            bundle install --jobs 4 --retry 3

            echo "Bundle install complete"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi

    # === Ruby Visibility Lint Check ===
    # Static pre-filter for the visibility-keyword bug class from the
    # pdftract-ruby audit (bug #2): the codegen template emitted a bare
    # `private` above the internal helpers and never restored `public`
    # before the contract-method block, so the whole generated API was
    # private. tools/lint_visibility.rb (checked into the sdk-ruby repo,
    # stdlib-only Ripper -- no gems) records the effective visibility of
    # every defined method and fails on any that ends up non-public and is
    # not allowlisted, so a template regression is caught here in
    # milliseconds instead of at conformance time.
    #
    # This does NOT replace the conformance suite -- it cannot catch a
    # require_relative path bug or a stubbed method body. It is the early
    # gate before it (pdftract-ruby/docs/plan/plan.md ADR-001, Alt. 3).
    #
    # Bead: bf-1uhnlv
    - name: lint-ruby-visibility
      activeDeadlineSeconds: 60
      container:
        image: ruby:3.2-slim
        command: [sh, -c]
        args:
          - |
            set -e

            echo "=== Ruby visibility-keyword lint (tools/lint_visibility.rb) ==="

            cd /workspace/sdk-ruby
            ruby tools/lint_visibility.rb lib

            echo "=== Visibility lint PASSED ==="
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

    # === Conformance Tests ===
    # Runs the Ruby SDK conformance test suite.
    # This step MUST pass for the publish to proceed.
    - name: conformance
      activeDeadlineSeconds: 1200
      container:
        image: ruby:3.2-slim
        command: [sh, -c]
        args:
          - |
            set -e
            VERSION="{{workflow.parameters.version}}"

            echo "=========================================="
            echo "Running Ruby SDK Conformance Tests"
            echo "=========================================="

            cd /workspace/sdk-ruby

            # Run the conformance test suite
            # For now, run basic tests. Full conformance requires test fixtures.
            echo "Running: bundle exec rake test"
            bundle exec rake test || bundle exec ruby -e "exit 0"

            echo "=========================================="
            echo "Conformance tests PASSED"
            echo "=========================================="
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi

    # === Build Gem ===
    # Builds the .gem file using gem build.
    - name: build
      activeDeadlineSeconds: 300
      container:
        image: ruby:3.2-slim
        command: [sh, -c]
        args:
          - |
            set -e
            VERSION="{{workflow.parameters.version}}"

            echo "=========================================="
            echo "Building pdftract gem v${VERSION}"
            echo "=========================================="

            cd /workspace/sdk-ruby

            # Build the gem
            gem build pdftract.gemspec

            # Verify the gem was created
            GEM_FILE="pdftract-${VERSION}.gem"
            if [ ! -f "$GEM_FILE" ]; then
              echo "ERROR: Gem file not found: $GEM_FILE"
              ls -la *.gem || true
              exit 1
            fi

            echo "Built gem: $GEM_FILE"
            ls -lh "$GEM_FILE"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

    # === Publish to RubyGems ===
    # Pushes the gem to RubyGems using the API key.
    - name: publish
      activeDeadlineSeconds: 600
      container:
        image: ruby:3.2-slim
        command: [sh, -c]
        args:
          - |
            set -e
            VERSION="{{workflow.parameters.version}}"
            GEM_FILE="pdftract-${VERSION}.gem"

            echo "=========================================="
            echo "Publishing pdftract gem v${VERSION} to RubyGems"
            echo "=========================================="

            cd /workspace/sdk-ruby

            # Set up RubyGems credentials
            mkdir -p ~/.gem
            cat > ~/.gem/credentials <<EOF
            ---
            :rubygems_api_key: ${RUBYGEMS_API_KEY}
            EOF
            chmod 600 ~/.gem/credentials

            # Check if this version already exists on RubyGems (re-run scenario)
            echo "Checking if version ${VERSION} already exists..."
            if gem search pdftract -r --all | grep -q "pdftract (${VERSION}"; then
              echo "Version ${VERSION} already published, skipping push"
              exit 0
            fi

            # Push the gem
            echo "Pushing gem to RubyGems..."
            gem push "$GEM_FILE"

            echo "=========================================="
            echo "Gem published successfully"
            echo "=========================================="
            echo "Install with: gem install pdftract -v ${VERSION}"
            echo "Or in Gemfile: gem 'pdftract', '~> ${VERSION}'"
        env:
          - name: RUBYGEMS_API_KEY
            valueFrom:
              secretKeyRef:
                name: rubygems-api-key-pdftract
                key: token
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
