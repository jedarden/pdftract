    # === Quality Matrix ===
    # Run linting (clippy, fmt), security audit (cargo-audit), dependency review,
    # license/ban/advisory checks (cargo-deny), MSRV check, binary size budget,
    # memory ceiling enforcement, schema generation consistency, and log policy enforcement.
    #
    # Eight parallel Tier 1 quality gates — any failure blocks PR merge:
    # 1. clippy-fmt: General linting and formatting check with INV-8 unwrap/expect ban
    # 2. msrv-check: Verify no newer Rust features are used (MSRV 1.78)
    # 3. cargo-audit: Security advisory check on dependencies
    # 4. cargo-deny: License and security policy enforcement
    # 5. cargo-bloat: Binary size budget enforcement (<= 4 MB)
    # 6. memory-ceiling: Memory budget enforcement (analogous to cargo-bloat for RSS)
    # 7. log-policy-check: NEVER-log secrets enforcement (grep-based scan)
    # 8. schema-gen: Schema generation consistency check
    #
    # CRITICAL: All cargo commands MUST use --locked (or --locked --frozen)
    - name: quality-matrix
      activeDeadlineSeconds: 900
      dag:
        tasks:
          - name: clippy-fmt
            template: clippy-fmt
          - name: msrv-check
            template: msrv-check
          - name: cargo-audit
            template: cargo-audit
          - name: cargo-deny
            template: cargo-deny
          - name: cargo-bloat
            template: cargo-bloat
          - name: memory-ceiling
            template: memory-ceiling
          - name: log-policy-check
            template: log-policy-check
          - name: schema-gen
            template: schema-gen

    # === Clippy and Fmt Check ===
    # Runs clippy with warnings denied and INV-8 unwrap/expect enforcement.
    # This is a Tier 1 hard gate: any single failure blocks PR merge.
    #
    # Bead: pdftract-3cp3a
    # Plan section: Phase 0.4 Quality Targets
    #
    # Two-pass clippy strategy:
    # 1. Full workspace check with --features default,serve,decrypt and -D warnings
    # 2. Library-only check with -D clippy::unwrap_used -D clippy::expect_used (INV-8)
    #    The unwrap/expect ban applies ONLY to pdftract-core library code; test code
    #    and binaries retain permissive defaults.
    - name: clippy-fmt
      activeDeadlineSeconds: 900
      container:
        image: pdftract-test-glibc:1.78
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Clippy and Format Check"
            echo "=========================================="

            cd /workspace
            export CARGO_HOME="/cache/cargo/registry"
            export CARGO_TARGET_DIR="/cache/cargo/target-clippy"

            echo "=== Running clippy (full workspace) ==="
            echo "Features: default,serve,decrypt"
            cargo clippy --locked --all-targets --features default,serve,decrypt -- -D warnings

            echo "=== Running clippy (library-only INV-8 check) ==="
            echo "Enforcing: no unwrap() or expect() in pdftract-core"
            cargo clippy --locked --lib --features default,serve,decrypt \
              -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

            echo "=== Running fmt check ==="
            cargo fmt --check

            echo "=== Clippy and fmt checks passed ==="
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi

    # === MSRV Check ===
    # Builds with rust:1.78-slim to verify no newer Rust features are used.
    # This gate prevents silent MSRV drift that would break downstream consumers
    # on older toolchains.
    #
    # Bead: pdftract-2ai37
    # Plan section: Phase 0.4 Quality Targets
    - name: msrv-check
      activeDeadlineSeconds: 600
      container:
        image: rust:1.78-slim
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "MSRV Check (Rust 1.78)"
            echo "=========================================="

            cd /workspace
            export CARGO_HOME="/cache/cargo/registry"
            export CARGO_TARGET_DIR="/cache/cargo/target-msrv"

            echo "=== Building with Rust 1.78 (MSRV) ==="
            rustc --version

            # Build workspace with default features to catch MSRV violations
            cargo build --workspace --features default --locked

            echo "=== MSRV check passed ==="
            echo "No Rust 1.79+ features detected"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi

    # === Cargo Audit ===
    # Runs cargo-audit to check for security vulnerabilities in dependencies
    #
    # This is a Tier 1 hard gate from Quality Targets. Any single gate failure
    # blocks PR merge. Without it, this class of regression silently slips past
    # code review.
    #
    # Bead: pdftract-5gs4p
    # Plan section: Phase 0.4 Quality Targets
    #
    # Severity gating policy:
    # - Warnings are denied (non-zero exit code on any warning)
    # - >= medium severity advisories block PR merge
    # - Unmaintained advisories are ignored (informational only)
    # - audit.toml maintains allow-list of intentionally-ignored advisories
    - name: cargo-audit
      activeDeadlineSeconds: 300
      container:
        image: pdftract-test-glibc:1.78
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Security Audit (cargo-audit)"
            echo "=========================================="

            cd /workspace
            export CARGO_HOME="/cache/cargo/registry"

            # Install cargo-audit if not present
            if ! command -v cargo-audit &> /dev/null; then
              echo "Installing cargo-audit..."
              cargo install cargo-audit --locked
            fi

            echo "=== Running cargo audit with severity gating ==="
            echo "Policy: deny warnings, block on >= medium severity, ignore unmaintained"
            echo "Configuration: audit.toml (allow-list for ignored advisories)"

            # Run audit with severity gating
            # --deny warnings: fail on any warning
            # --ignore unmaintained: ignore unmaintained crate warnings
            # --severity: report only >= medium severity (low is informational)
            # --json: output both JSON (for artifacts) and human-readable (for logs)
            cargo audit --locked --deny warnings --ignore unmaintained \
              --severity medium \
              --json > /tmp/audit-report.json \
              || {
                EXIT_CODE=$?

                # Human-readable error summary for PR comments
                echo "=========================================="
                echo "SECURITY AUDIT FAILED"
                echo "=========================================="

                # Parse and display vulnerabilities from JSON
                if command -v jq &> /dev/null; then
                  VULN_COUNT=$(jq -r '.vulnerabilities.count // 0' /tmp/audit-report.json 2>/dev/null || echo "0")
                  WARNING_COUNT=$(jq -r '.warnings | length // 0' /tmp/audit-report.json 2>/dev/null || echo "0")

                  echo "Vulnerabilities: $VULN_COUNT"
                  echo "Warnings: $WARNING_COUNT"

                  if [ "$VULN_COUNT" -gt 0 ]; then
                    echo ""
                    echo "Affected dependencies:"
                    jq -r '.vulnerabilities.list[]? | "\(.advisory.id) - \(.package.name)@\(.package.version): \(.advisory.title)"' \
                      /tmp/audit-report.json 2>/dev/null || true
                  fi
                fi

                echo ""
                echo "Check the audit-report.json artifact for full details."
                echo "To intentionally ignore an advisory, add it to audit.toml with justification."

                exit $EXIT_CODE
              }

            # Parse and display summary for CI logs
            if command -v jq &> /dev/null; then
              VULN_COUNT=$(jq -r '.vulnerabilities.count // 0' /tmp/audit-report.json 2>/dev/null || echo "0")
              DEP_COUNT=$(jq -r '.lockfile.dependency-count // 0' /tmp/audit-report.json 2>/dev/null || echo "0")

              echo "=== Security audit passed ==="
              echo "Dependencies scanned: $DEP_COUNT"
              echo "Vulnerabilities found: $VULN_COUNT"
              echo "Severity threshold: >= medium (denied)"
            else
              echo "=== Security audit passed ==="
            fi

            # Copy report to workspace for artifact upload
            cp /tmp/audit-report.json /workspace/audit-report.json
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
      outputs:
        artifacts:
          - name: audit-report
            path: /workspace/audit-report.json

    # === Cargo Deny ===
    # Runs cargo-deny to check licenses, bans, sources, and advisories
    #
    # This is a Tier 1 hard gate from Quality Targets. Any single gate failure
    # blocks PR merge. Without it, license violations, banned dependencies, or
    # source registry issues silently slip past code review.
    #
    # Bead: pdftract-1rljr
    # Plan section: Phase 0.4 Quality Targets
    #
    # Enforcement policy:
    # - Licenses: Only MIT, Apache-2.0, BSD-2/3-Clause, ISC, Zlib, Unicode-DFS-2016 allowed
    # - GPL/AGPL/LGPL are denied (copyleft contamination)
    # - MPL-2.0 exceptions require ADR documentation (cbindgen, option-ext)
    # - Bans: Wildcard dependencies denied, duplicate versions warned
    # - Advisories: Yanked crates denied, RustSec advisories denied (with exceptions)
    # - Sources: Unknown registries and git sources denied
    # - deny.toml maintains the policy configuration and exceptions
    - name: cargo-deny
      activeDeadlineSeconds: 300
      container:
        image: pdftract-test-glibc:1.78
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "License, Ban, Source, Advisory Check (cargo-deny)"
            echo "=========================================="

            cd /workspace
            export CARGO_HOME="/cache/cargo/registry"

            # Install cargo-deny if not present
            if ! command -v cargo-deny &> /dev/null; then
              echo "Installing cargo-deny..."
              cargo install cargo-deny --locked
            fi

            echo "=== Running cargo deny check ==="
            echo "Checks: licenses, bans, sources, advisories"
            echo "Configuration: deny.toml (policy and exceptions)"

            # Run all checks in one command
            # Note: cargo-deny returns exit code 1 for warnings and 2 for errors/denials
            # We treat warnings (duplicate versions) as PASS, actual denials as FAIL
            OUTPUT=$(cargo deny check \
              licenses bans sources advisories \
              2>&1) || EXIT_CODE=$?

            echo "$OUTPUT"

            # Parse output to determine if there are actual denials (not just warnings)
            # Denials contain "error[" prefix, warnings contain "warning[" prefix
            if echo "$OUTPUT" | grep -q "error\["; then
              echo "=========================================="
              echo "CARGO DENY CHECKS FAILED"
              echo "=========================================="

              echo ""
              echo "One or more checks were denied:"
              echo "  - licenses: Dependency license violations"
              echo "  - bans: Banned crates (not duplicate version warnings)"
              echo "  - sources: Unknown registries or git sources"
              echo "  - advisories: Security vulnerabilities (RustSec)"
              echo ""
              echo "Review the error output above for specific violations."
              echo "To intentionally allow a violation:"
              echo "  1. Licenses: Add exception to deny.toml [licenses.exceptions]"
              echo "  2. Bans: Add crate to deny.toml [bans.skip] or [bans.allow]"
              echo "  3. Advisories: Add to deny.toml [advisories.ignore]"
              echo "  4. For MPL/GPL exceptions: Create ADR in docs/adr/ first"
              echo ""
              echo "See: https://embarkstudios.github.io/cargo-deny/"

              exit 1
            fi

            # If we reach here, either all checks passed or there were only warnings
            echo ""
            echo "=== All cargo-deny checks passed ==="
            echo "Licenses: PASS"
            echo "Bans: PASS (warnings allowed)"
            echo "Sources: PASS"
            echo "Advisories: PASS"

            # Count warnings for informational purposes
            WARN_COUNT=$(echo "$OUTPUT" | grep -c "warning\[" || echo "0")
            if [ "$WARN_COUNT" -gt 0 ]; then
              echo "Note: $WARN_COUNT warning(s) present (non-blocking)"
            fi

            # Generate JSON report for artifacts (optional, for record-keeping)
            if command -v jq &> /dev/null; then
              echo "{\"status\":\"passed\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > /workspace/deny-report.json
              echo "Report generated: deny-report.json"
            fi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
      outputs:
        artifacts:
          - name: deny-report
            path: /workspace/deny-report.json
            optional: true

    # === Cargo Bloat ===
    # Runs cargo-bloat to enforce the 4 MB binary size budget.
    #
    # This is a Tier 1 hard gate from Quality Targets. Binary size > 4 MB blocks
    # PR merge. Without this gate, binary size regressions silently slip past code
    # review and risk breaking the R2 target (single-page PDF extraction in < 100ms
    # on a 1.6 GHz CPU, which requires a small binary to fit in CPU cache).
    #
    # Bead: pdftract-2rf
    # Plan section: Phase 0.4 Quality Targets
    #
    # Enforcement policy:
    # - Binary size (stripped) must be <= 4,194,304 bytes (4 MB) for x86_64-unknown-linux-musl
    # - Other targets (macOS, Windows) are informational (not gated) due to larger metadata
    # - Output is published as bloat-report.json artifact for historical tracking
    # - A second invocation with --features remote tracks ureg contribution (PB-5 data)
    #
    # If budget exceeded, the first-line response is PB-2: switch wordlist to Bloom filter
    # behind the wordlist-bloom feature (documented in ADR-002).
    - name: cargo-bloat
      activeDeadlineSeconds: 600
      container:
        image: pdftract-test-glibc:1.78
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Cargo Bloat (Binary Size Budget)"
            echo "=========================================="

            cd /workspace
            export CARGO_HOME="/cache/cargo/registry"
            export CARGO_TARGET_DIR="/cache/cargo/target-bloat"

            # Install cargo-bloat if not present
            if ! command -v cargo-bloat &> /dev/null; then
              echo "Installing cargo-bloat..."
              cargo install cargo-bloat --locked
            fi

            echo "=== Running cargo bloat (default features, gated) ==="
            echo "Target: x86_64-unknown-linux-musl"
            echo "Budget: 4 MB (4,194,304 bytes)"

            # Build release binary first for accurate analysis
            cargo build --release --target x86_64-unknown-linux-musl --features default --locked

            # Run cargo bloat and capture output
            cargo bloat --release --features default --crates --target x86_64-unknown-linux-musl -n 50 \
              > /tmp/bloat-default.txt 2>&1 || true

            # Parse binary size from output
            # cargo-bloat output format: "File: pdftract X MB"
            BINARY_PATH="target/x86_64-unknown-linux-musl/release/pdftract"
            if [ ! -f "$BINARY_PATH" ]; then
              echo "ERROR: Binary not found at $BINARY_PATH" >&2
              exit 1
            fi

            # Get stripped binary size
            STRIPPED_SIZE=$(x86_64-linux-musl-strip -o /tmp/pdftract-stripped "$BINARY_PATH" 2>/dev/null && stat -c%s /tmp/pdftract-stripped || stat -c%s "$BINARY_PATH")
            BUDGET=4194304  # 4 MB

            echo "=== Binary size analysis ==="
            echo "Stripped size: $STRIPPED_SIZE bytes"
            echo "Budget: $BUDGET bytes"
            echo "Remaining: $((BUDGET - STRIPPED_SIZE)) bytes"

            # Generate JSON report
            cat > /workspace/bloat-report.json <<EOF
            {
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
              "commit_sha": "{{workflow.parameters.commit-sha}}",
              "target": "x86_64-unknown-linux-musl",
              "features": "default",
              "stripped_size_bytes": $STRIPPED_SIZE,
              "budget_bytes": $BUDGET,
              "within_budget": $( [ "$STRIPPED_SIZE" -le "$BUDGET" ] && echo "true" || echo "false" ),
              "raw_output": $(jq -R -s '.' < /tmp/bloat-default.txt)
            }
            EOF

            # Check against budget
            if [ "$STRIPPED_SIZE" -gt "$BUDGET" ]; then
              echo "=========================================="
              echo "CARGO BLOAT CHECK FAILED"
              echo "=========================================="
              echo "Binary size exceeds 4 MB budget"
              echo "Size: $STRIPPED_SIZE bytes"
              echo "Budget: $BUDGET bytes"
              echo "Over: $((STRIPPED_SIZE - BUDGET)) bytes"
              echo ""
              echo "First-line response (per PB-2):"
              echo "  Switch wordlist to Bloom filter behind wordlist-bloom feature."
              echo "  See ADR-002 for implementation guidance."
              echo ""
              echo "Top contributors:"
              head -30 /tmp/bloat-default.txt || true
              echo ""
              echo "See bloat-report.json artifact for full details."
              exit 1
            fi

            echo "=== Running cargo bloat (remote features, informational) ==="
            echo "This tracks ureg's contribution for PB-5 (alt-feature escape hatch)"
            cargo bloat --release --features remote --crates --target x86_64-unknown-linux-musl -n 50 \
              > /tmp/bloat-remote.txt 2>&1 || true

            # Append remote feature data to report
            if command -v jq &> /dev/null; then
              jq --arg remote "$(jq -R -s '.' < /tmp/bloat-remote.txt)" \
                '. + {"remote_features_raw": $remote}' /workspace/bloat-report.json \
                > /tmp/bloat-report-merged.json && mv /tmp/bloat-report-merged.json /workspace/bloat-report.json
            fi

            echo "=== Cargo bloat checks passed ==="
            echo "Binary within 4 MB budget"
            echo "Size: $STRIPPED_SIZE bytes ($(( STRIPPED_SIZE * 100 / BUDGET ))% of budget)"

            # Display top contributors for visibility
            echo ""
            echo "Top 20 contributors:"
            head -30 /tmp/bloat-default.txt | tail -20 || true
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
      outputs:
        artifacts:
          - name: bloat-report
            path: /workspace/bloat-report.json

    # === Memory Ceiling ===
    # Runs memory ceiling tests to enforce RSS budgets.
    #
    # This is a Tier 1 hard gate from Quality Targets. Any document exceeding
    # its memory budget blocks PR merge. Without this gate, memory regressions
    # silently slip past code review and risk breaking the Memory targets.
    #
    # Bead: bf-1g1fd
    # Plan section: Phase 0.4 Quality Targets - Memory targets
    #
    # Enforcement policy:
    # - Peak RSS, 100-page vector PDF (buffered mode) < 512 MB
    # - Peak RSS, streaming/NDJSON mode (any page count) < 256 MB
    # - Peak RSS, adversarial fixtures < 1 GB hard ceiling
    # - Output is published as memory-report.json artifact for historical tracking
    # - Tests run under cgroup MemoryMax cap for clean failure mode
    - name: memory-ceiling
      activeDeadlineSeconds: 600
      container:
        image: pdftract-test-glibc:1.78
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Memory Ceiling Tests"
            echo "=========================================="

            cd /workspace
            export CARGO_HOME="/cache/cargo/registry"
            export CARGO_TARGET_DIR="/cache/cargo/target-memory-ceiling"

            echo "=== Running memory ceiling tests ==="
            echo "Budgets:"
            echo "  - Buffered 100-page: 512 MB"
            echo "  - Streaming mode: 256 MB"
            echo "  - Adversarial hard cap: 1024 MB"
            echo ""
            echo "Cgroup MemoryMax: 1536 MB (1.5 GB cap for clean failure)"
            echo "  This enforces a hard ceiling on the entire test run."
            echo "  Individual document budgets are enforced by the harness."

            # Check if cgroup v2 is available (preferred)
            if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
              echo "=== Using cgroup v2 for memory enforcement ==="

              # Create a child cgroup for this test run
              CGROUP_PATH="/sys/fs/cgroup/memory-ceiling-test"
              mkdir -p "$CGROUP_PATH"

              # Set memory limit (1.5 GB to allow overhead)
              echo "max 1536M" > "$CGROUP_PATH/memory.max"

              # Enable memory controller
              echo "+memory" > /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || true

              # Launch the test in the cgroup
              # Run xtask memory-ceiling command which:
              # - Builds pdftract in release mode
              # - Measures peak RSS while extracting perf and malformed corpora
              # - Generates memory-report.json with detailed results
              (
                # Add current process to the cgroup
                echo $$ > "$CGROUP_PATH/cgroup.procs"

                cd /workspace/xtask && cargo run --release -- memory-ceiling
              ) || {
                EXIT_CODE=$?

                # Clean up cgroup
                rmdir "$CGROUP_PATH" 2>/dev/null || true

                echo "=========================================="
                echo "MEMORY CEILING CHECKS FAILED"
                echo "=========================================="
                echo ""
                echo "One or more documents exceeded their memory budget."
                echo "Review the output above for specific violations."
                echo ""
                echo "Memory targets are Tier-1 gates per Phase 0.4 Quality Targets."
                echo "See plan.md line 72-80 for budget definitions."

                exit $EXIT_CODE
              }

              # Clean up cgroup
              rmdir "$CGROUP_PATH" 2>/dev/null || true

            elif [ -w /sys/fs/cgroup/memory/memory.limit_in_bytes ]; then
              echo "=== Using cgroup v1 for memory enforcement ==="

              # Create a cgroup for this test run (cgroup v1)
              CGROUP_PATH="/sys/fs/cgroup/memory/memory-ceiling-test"

              # Clean up any existing cgroup
              mkdir -p "$CGROUP_PATH" 2>/dev/null || rmdir "$CGROUP_PATH" 2>/dev/null
              mkdir -p "$CGROUP_PATH"

              # Set memory limit (1.5 GB to allow overhead)
              MEMORY_MAX_BYTES=$((1536 * 1024 * 1024))
              echo "$MEMORY_MAX_BYTES" > "$CGROUP_PATH/memory.limit_in_bytes"

              # Disable OOM killer (let it fail cleanly)
              echo 0 > "$CGROUP_PATH/memory.oom_control" 2>/dev/null || true

              # Launch the test in the cgroup
              (
                # Add current process to the cgroup
                echo $$ > "$CGROUP_PATH/tasks"

                cd /workspace/xtask && cargo run --release -- memory-ceiling
              ) || {
                EXIT_CODE=$?

                # Clean up cgroup
                rmdir "$CGROUP_PATH" 2>/dev/null || true

                echo "=========================================="
                echo "MEMORY CEILING CHECKS FAILED"
                echo "=========================================="
                echo ""
                echo "One or more documents exceeded their memory budget."
                echo "Review the output above for specific violations."
                echo ""
                echo "Memory targets are Tier-1 gates per Phase 0.4 Quality Targets."
                echo "See plan.md line 72-80 for budget definitions."

                exit $EXIT_CODE
              }

              # Clean up cgroup
              rmdir "$CGROUP_PATH" 2>/dev/null || true

            else
              echo "=== WARNING: No cgroup memory controller available ==="
              echo "Running without cgroup MemoryMax enforcement."
              echo "Individual document budgets will still be enforced by the harness."
              echo ""

              # Run xtask memory-ceiling command
              cd /workspace/xtask && cargo run --release -- memory-ceiling \
                || {
                  EXIT_CODE=$?

                  echo "=========================================="
                  echo "MEMORY CEILING CHECKS FAILED"
                  echo "=========================================="
                  echo ""
                  echo "One or more documents exceeded their memory budget."
                  echo "Review the output above for specific violations."
                  echo ""
                  echo "Memory targets are Tier-1 gates per Phase 0.4 Quality Targets."
                  echo "See plan.md line 72-80 for budget definitions."

                  exit $EXIT_CODE
                }
            fi

            echo ""
            echo "=== Memory ceiling checks passed ==="
            echo "All documents within their RSS budgets"

            # Verify the xtask-generated report exists
            if [ -f /workspace/memory-report.json ]; then
              echo "Report generated by xtask: memory-report.json"
              # Show summary from report
              if command -v jq &> /dev/null; then
                echo ""
                echo "Summary:"
                jq -r '"\(.summary.passed)/\(.summary.total_tests) tests passed"' /workspace/memory-report.json
                jq -r '"Budgets: buffered=\(.budgets.buffered_100_page_mb)MB streaming=\(.budgets.streaming_any_mb)MB adversarial=\(.budgets.adversarial_hard_cap_mb)MB"' /workspace/memory-report.json
              fi
            else
              echo "WARNING: xtask did not generate memory-report.json"
              # Generate minimal report for artifact upload
              cat > /workspace/memory-report.json <<EOF
              {
                "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "commit_sha": "{{workflow.parameters.commit-sha}}",
                "status": "passed",
                "budgets": {
                  "buffered_100_page_mb": 512,
                  "streaming_any_mb": 256,
                  "adversarial_hard_cap_mb": 1024
                },
                "summary": {
                  "total_tests": 0,
                  "passed": 0,
                  "failed": 0,
                  "all_passed": true
                }
              }
              EOF
            fi
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
      outputs:
        artifacts:
          - name: memory-report
            path: /workspace/memory-report.json

    # === Schema Generation Check ===
    # Regenerates JSON schema from Rust types and verifies it matches the committed file.
    #
    # This is a Tier 1 hard gate from Phase 6.1.3. It ensures the auto-generated schema
    # stays in sync with the Rust type definitions. Without this gate, schema drift
    # silently slips past code review and the published schema becomes incorrect.
    #
    # Bead: pdftract-16h0a
    # Plan section: Phase 6.1.3
    #
    # Enforcement policy:
    # - Schema is regenerated via cargo xtask gen-schema
    # - Regenerated output is compared to committed docs/schema/v1.0/pdftract.schema.json
    # - Any diff (including whitespace, key order) fails the build
    # - Error message includes exact reproduction command
    # - Schema changes involving Phase 7 placeholders are backward-compatible additions
    # - Breaking changes require explicit schema_version bump (separate bead)
    - name: schema-gen
      activeDeadlineSeconds: 300
      container:
        image: pdftract-test-glibc:1.78
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Schema Generation Check"
            echo "=========================================="

            cd /workspace
            export CARGO_HOME="/cache/cargo/registry"
            export CARGO_TARGET_DIR="/cache/cargo/target-schema-gen"

            echo "=== Regenerating JSON schema ==="
            echo "Command: cargo xtask gen-schema"
            cd /workspace/xtask && cargo run --release -- gen-schema || {
              EXIT_CODE=$?

              echo "=========================================="
              echo "SCHEMA GENERATION FAILED"
              echo "=========================================="
              echo ""
              echo "The schema generation command crashed with exit code $EXIT_CODE."
              echo "This is likely a bug in the generator, not a schema mismatch."
              echo ""
              echo "Check the output above for specific errors."

              exit $EXIT_CODE
            }

            echo ""
            echo "=== Comparing to committed schema ==="
            SCHEMA_FILE="docs/schema/v1.0/pdftract.schema.json"

            if ! git diff --exit-code "$SCHEMA_FILE"; then
              echo "=========================================="
              echo "SCHEMA MISMATCH DETECTED"
              echo "=========================================="
              echo ""
              echo "The regenerated schema differs from the committed file:"
              echo "  File: $SCHEMA_FILE"
              echo ""
              echo "To fix this issue:"
              echo "  1. Run locally: cargo xtask gen-schema"
              echo "  2. Commit the regenerated schema file"
              echo "  3. Push the commit"
              echo ""
              echo "Diff:"
              git diff "$SCHEMA_FILE"

              exit 1
            fi

            echo ""
            echo "=== Schema generation check passed ==="
            echo "Schema is up to date: $SCHEMA_FILE"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi

    # === Log Policy Check ===
    # Enforces NEVER-log secrets policy across the codebase.
    #
    # This is a Tier 1 hard gate from Phase 6 audit logging policy. It scans
    # the codebase for log calls that might leak credentials, auth headers, or
    # sensitive content. Without this gate, credential leakage can silently slip
    # past code review and appear in logs, crash dumps, and SIEM systems.
    #
    # Bead: pdftract-3990k
    # Plan section: Phase 6 audit logging policy (lines 931-964)
    #
    # Enforcement policy:
    # - No log calls with credential variable names (password, token, secret, api_key, etc.)
    # - No log calls with sensitive content variables (body, content, text, data)
    # - Authorization/Cookie/Proxy-Authorization headers must be redacted
    # - SecretString values must always render as [REDACTED]
    # - Script: .ci/scripts/check-log-policy.sh (grep-based scan)
    - name: log-policy-check
      activeDeadlineSeconds: 300
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Log-Policy Enforcement Check"
            echo "=========================================="

            cd /workspace

            echo "=== Running log policy scan ==="
            echo "Scanning for forbidden patterns:"
            echo "  - Credential variables in log calls"
            echo "  - Sensitive content variables in log calls"
            echo "  - Auth headers without redaction"
            echo ""

            # Install bash for the check script
            apk add --no-cache bash

            # Run the log policy check script
            bash .ci/scripts/check-log-policy.sh || {
              EXIT_CODE=$?

              echo "=========================================="
              echo "LOG POLICY CHECK FAILED"
              echo "=========================================="
              echo ""
              echo "The log policy enforcement check detected potential violations."
              echo "Review the output above for specific issues."
              echo ""
              echo "Forbidden patterns:"
              echo "  - Log calls with credential variables (password, token, secret, api_key, etc.)"
              echo "  - Log calls with sensitive content variables (body, content, text, data)"
              echo "  - Auth headers without redaction (Authorization, Cookie, Proxy-Authorization)"
              echo ""
              echo "To fix violations:"
              echo "  - Use SecretString for all credentials (secrecy crate)"
              echo "  - Never log request bodies or extracted text"
              echo "  - Use redact_headers_for_log() for HTTP logging"
              echo ""
              echo "Log policy enforcement is a Tier-1 quality gate per Phase 6."
              echo "See plan.md lines 931-964 for the full policy."

              exit $EXIT_CODE
            }

            echo ""
            echo "=== Log policy check passed ==="
            echo "No credential leaks or forbidden patterns detected"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

    # === WER Gate ===
    # Word Error Rate CI gate for OCR accuracy validation
    #
    # This is a Tier 1 hard gate from Phase 5.4.5. It validates OCR accuracy
    # against calibrated fixtures to ensure the "WER < 3% on clean 300-DPI scans"
    # target is met. Without this gate, OCR regressions silently slip past code
    # review and risk breaking the primary Phase 5 objective.
    #
    # Bead: pdftract-315s
    # Plan section: Phase 5.4.5 (lines 1905-1908)
    #
    # Enforcement policy:
    # - Clean Lorem Ipsum: WER < 2.0% (critical test)
    # - Multi-language eng+fra: WER < 3.0%
    # - 10-page performance: < 30 seconds processing time
    # - Fixtures are manually generated per README instructions
    #
    # The WER gate script (ci/wer-gate.sh) runs three tests:
    # 1. Clean fixture: OCR accuracy on pristine 300-DPI text
    # 2. Multi-language: English+French mixed document
    # 3. Performance: 10-page document processing time
    - name: wer-gate
      inputs:
        artifacts:
          - name: pdftract-binary
            path: /tmp/pdftract-binary
      activeDeadlineSeconds: 600
      container:
        image: pdftract-test-glibc:1.78
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "WER Gate - OCR Accuracy Validation"
            echo "=========================================="

            cd /workspace

            # Install pdftract binary from build-matrix artifact
            echo "=== Installing pdftract binary ==="
            PDFTRACT_ARTIFACT="/tmp/pdftract-binary"
            if [ -f "$PDFTRACT_ARTIFACT" ]; then
              cp "$PDFTRACT_ARTIFACT" /usr/local/bin/pdftract
              chmod +x /usr/local/bin/pdftract
              echo "pdftract binary installed from artifact"
            else
              echo "ERROR: pdftract binary not found in artifacts"
              exit 1
            fi

            pdftract --version || echo "Binary version check passed"

            # Run WER gate script
            echo "=== Running WER gate ==="
            bash ci/wer-gate.sh || {
              EXIT_CODE=$?
              echo ""
              echo "=========================================="
              echo "WER GATE FAILED"
              echo "=========================================="
              echo ""
              echo "One or more WER tests failed:"
              echo "  - Clean fixture: WER < 2.0%"
              echo "  - Multi-language: WER < 3.0%"
              echo "  - Performance: < 30 seconds"
              echo ""
              echo "Check the output above for specific failures."
              echo "Fixtures may need to be generated manually per README instructions."
              echo ""
              echo "WER gate is a Tier-1 quality gate per Phase 5.4.5."
              echo "See plan.md lines 1905-1908 for acceptance criteria."

              exit $EXIT_CODE
            }

            echo ""
            echo "=== WER gate passed ==="
            echo "All OCR accuracy and performance tests within thresholds"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi

    # === Bench Matrix ===
    # Competitive benchmarks: pdftract vs pdfminer.six, pypdf, pdfplumber
    # Runs hyperfine against 50-PDF corpus (25 vector + 25 raster)
    # Enforces regression gate (>10%) and 10x-faster gate (vs pdfminer)
    - name: bench-matrix
      inputs:
        artifacts:
          - name: pdftract-binary
            path: /tmp/pdftract-binary
      activeDeadlineSeconds: 3600
      container:
        image: python:3.11-slim-bookworm
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Competitive Benchmark Matrix"
            echo "=========================================="

            cd /workspace

            # Install hyperfine
            echo "=== Installing hyperfine ==="
            apt-get update -qq
            apt-get install -y hyperfine jq

            # Install competitor tools
            echo "=== Installing competitor tools ==="
            pip install --no-cache-dir -r benches/competitors/requirements.txt

            # Get pdftract binary from build-matrix artifact
            echo "=== Installing pdftract binary ==="
            PDFTRACT_ARTIFACT="/tmp/pdftract-binary"
            if [ -f "$PDFTRACT_ARTIFACT" ]; then
              cp "$PDFTRACT_ARTIFACT" /usr/local/bin/pdftract
              chmod +x /usr/local/bin/pdftract
              echo "pdftract binary installed from artifact"
            else
              echo "WARNING: pdftract binary not found in artifacts, using PATH"
            fi

            # Verify pdftract is available
            if ! command -v pdftract &> /dev/null; then
              echo "WARNING: pdftract not found in PATH, benchmarks will fail"
            else
              pdftract --version || echo "WARNING: pdftract --version failed"
            fi

            # Get baseline from main branch
            echo "=== Fetching baseline from main branch ==="
            mkdir -p /tmp/baseline
            if git show main:benches/baselines/main.json > /tmp/baseline/main.json 2>/dev/null; then
              export BASELINE="/tmp/baseline/main.json"
              echo "Baseline loaded from main branch"
            else
              echo "WARNING: Could not fetch baseline from main, using local file"
              export BASELINE="benches/baselines/main.json"
            fi

            # Run benchmarks
            echo "=== Running competitive benchmarks ==="
            cd benches/competitors

            # Set output paths
            export OUTPUT="/tmp/benchmark-results.json"
            export COMMENT="/tmp/benchmark-comment.md"

            # Run the benchmark script
            bash run-benchmarks.sh || {
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 1 ]; then
                echo "ERROR: Benchmark gates failed!"
                exit 1
              else
                echo "ERROR: Benchmark execution failed with code $EXIT_CODE"
                exit 1
              fi
            }

            # Copy results to workspace for artifacts
            cp "$OUTPUT" /workspace/benchmark-results.json
            cp "$COMMENT" /workspace/benchmark-comment.md

            echo "=== Benchmark complete ==="
            echo "Results:"
            cat "$OUTPUT" | jq -r '[.[] | select(.tool == "pdftract") | .mean_ms] | length' | xargs -I {} echo "  pdftract results: {}"
            cat "$OUTPUT" | jq -r '[.[] | select(.tool == "pdfminer") | .mean_ms] | length' | xargs -I {} echo "  pdfminer results: {}"

            echo "=== All gates passed ==="
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        outputs:
          artifacts:
            - name: benchmark-results
              path: /workspace/benchmark-results.json
            - name: benchmark-comment
              path: /workspace/benchmark-comment.md

    # === Benchmark PR Comment ===
    # Posts benchmark results as a comment on the pull request
    # Only runs when pr-number parameter is non-empty
    - name: benchmark-pr-comment
      inputs:
        artifacts:
          - name: benchmark-comment
            path: /tmp/benchmark-comment.md
      activeDeadlineSeconds: 60
      container:
        image: debian:12
        command: [sh, -c]
        args:
          - |
            set -e
            PR_NUMBER="{{workflow.parameters.pr-number}}"
            COMMENT_FILE="/tmp/benchmark-comment.md"

            echo "=== Posting benchmark comment to PR #$PR_NUMBER ==="

            # Read comment content
            if [ ! -f "$COMMENT_FILE" ]; then
              echo "ERROR: Benchmark comment file not found"
              exit 1
            fi

            COMMENT_BODY=$(cat "$COMMENT_FILE")

            # Post comment via GitHub API
            curl -s -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/jedarden/pdftract/issues/${PR_NUMBER}/comments" \
              -d "{\"body\": $(echo "$COMMENT_BODY" | jq -R -s '.')}"

            echo "=== Benchmark comment posted successfully ==="
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-webhook-secret
                key: token
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

    # === Regression Corpus ===
    # Run pdftract binary against 500-PDF private regression corpus via ARMOR proxy
    # Compares per-document CER against baseline; fails if delta > 0.5%
    - name: regression-corpus
      activeDeadlineSeconds: 600
      dag:
        onExit: regression-corpus-exit
        tasks:
          - name: build-cer-diff
            template: build-cer-diff
          - name: regression-shards
            template: regression-shard
            dependencies: [build-cer-diff]
            withSequence:
              start: "0"
              end: "7"
            arguments:
              parameters:
                - name: shard-index
                  value: "{{item}}"
                - name: shard-total
                  value: "8"
              artifacts:
                - name: pdftract-binary
                  from: "{{tasks.build-matrix.tasks.build-linux-x86_64-musl.outputs.artifacts.pdftract-binary}}"

    # === Build CER Diff Tool ===
    # Build the cer-diff binary for comparing extraction outputs
    - name: build-cer-diff
      activeDeadlineSeconds: 300
      container:
        image: rust:1.83-bookworm
        command: [bash, -c]
        args:
          - |
            set -eo pipefail
            echo "=== Building cer-diff tool ==="
            cd /workspace
            export CARGO_HOME="/cache/cargo/registry"
            export CARGO_TARGET_DIR="/cache/cargo/target-cer-diff"
            cargo build --release --bin cer-diff --package pdftract-cer-diff --locked
            cp target/release/cer-diff /shared/cer-diff
            echo "=== cer-diff binary ready ==="
            ls -lh /shared/cer-diff
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
          - name: shared-artifacts
            mountPath: /shared
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi

    # === Regression Shard ===
    # Process a subset of the regression corpus (1 of 8 shards)
    - name: regression-shard
      inputs:
        parameters:
          - name: shard-index
          - name: shard-total
        artifacts:
          - name: pdftract-binary
            path: /tmp/pdftract-binary
      activeDeadlineSeconds: 360
      container:
        image: pdftract-test-glibc:1.78
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            SHARD_INDEX="{{inputs.parameters.shard-index}}"
            SHARD_TOTAL="{{inputs.parameters.shard-total}}"
            THRESHOLD="0.005"
            REGRESSION_MODE="{{workflow.parameters.regression-mode}}"

            echo "=========================================="
            echo "Regression Shard: $SHARD_INDEX / $SHARD_TOTAL"
            echo "Mode: $REGRESSION_MODE"
            echo "=========================================="

            # Configure AWS CLI for ARMOR proxy
            export AWS_ACCESS_KEY_ID="$ARMOR_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$ARMOR_SECRET_ACCESS_KEY"
            export AWS_ENDPOINT_URL="http://armor.armor.svc.cluster.local:9000"

            # Download pdftract binary
            echo "=== Downloading pdftract binary ==="
            PDFTRACT_ARTIFACT="/tmp/pdftract-binary"
            if [ -f "$PDFTRACT_ARTIFACT" ]; then
              cp "$PDFTRACT_ARTIFACT" ./pdftract-x86_64-unknown-linux-musl
              chmod +x pdftract-x86_64-unknown-linux-musl
              echo "Binary downloaded from artifact"
            else
              echo "ERROR: pdftract binary not found in artifacts"
              exit 1
            fi

            ./pdftract-x86_64-unknown-linux-musl --version || echo "Binary check passed"

            # Copy cer-diff to PATH
            cp /shared/cer-diff /usr/local/bin/cer-diff
            chmod +x /usr/local/bin/cer-diff
            cer-diff --help || true

            # Create output directory
            mkdir -p /regression/results

            # List corpus files for this shard
            echo "=== Fetching corpus document list ==="
            aws s3 ls --endpoint-url="$AWS_ENDPOINT_URL" "s3://pdftract-regression-corpus/v1/" | \
              awk '{print $NF}' | grep '\.pdf$' > /tmp/all_docs.txt

            TOTAL_DOCS=$(wc -l < /tmp/all_docs.txt)
            echo "Total documents in corpus: $TOTAL_DOCS"

            # Calculate shard boundaries
            DOCS_PER_SHARD=$(( (TOTAL_DOCS + SHARD_TOTAL - 1) / SHARD_TOTAL ))
            START_LINE=$((SHARD_INDEX * DOCS_PER_SHARD + 1))
            END_LINE=$((START_LINE + DOCS_PER_SHARD - 1))

            echo "Shard $SHARD_INDEX: processing lines $START_LINE to $END_LINE"

            # Extract shard documents
            sed -n "${START_LINE},${END_LINE}p" /tmp/all_docs.txt > /tmp/shard_docs.txt
            SHARD_DOC_COUNT=$(wc -l < /tmp/shard_docs.txt)
            echo "Documents in this shard: $SHARD_DOC_COUNT"

            # Process each document
            PASS_COUNT=0
            FAIL_COUNT=0
            PROCESSED=0

            while IFS= read -r pdf_name; do
              [ -z "$pdf_name" ] && continue
              PROCESSED=$((PROCESSED + 1))

              SHA256="${pdf_name%.pdf}"
              PDF_PATH="s3://pdftract-regression-corpus/v1/${pdf_name}"
              BASELINE_PATH="s3://pdftract-regression-corpus/baselines/${SHA256}.json"

              echo "[$PROCESSED/$SHARD_DOC_COUNT] Processing: $pdf_name"

              # Download PDF
              aws s3 cp --endpoint-url="$AWS_ENDPOINT_URL" "$PDF_PATH" "/tmp/${pdf_name}" || {
                echo "ERROR: Failed to download PDF: $pdf_name"
                continue
              }

              # Run pdftract extraction
              if ! ./pdftract-x86_64-unknown-linux-musl extract --json --pages all "/tmp/${pdf_name}" > /tmp/actual.json 2>/dev/null; then
                echo "ERROR: Extraction failed for: $pdf_name"
                continue
              fi

              # Fetch or compute baseline
              if [ "$REGRESSION_MODE" = "update" ]; then
                # Update mode: save current output as new baseline
                aws s3 cp --endpoint-url="$AWS_ENDPOINT_URL" /tmp/actual.json "$BASELINE_PATH"
                RESULT="{\"sha\":\"$SHA256\",\"cer_delta\":0.0,\"pass\":true,\"mode\":\"update\"}"
              else
                # Gate mode: compare against baseline
                if ! aws s3 cp --endpoint-url="$AWS_ENDPOINT_URL" "$BASELINE_PATH" /tmp/baseline.json 2>/dev/null; then
                  echo "WARN: No baseline found for: $pdf_name (new corpus doc?)"
                  RESULT="{\"sha\":\"$SHA256\",\"cer_delta\":0.0,\"pass\":true,\"note\":\"no_baseline\"}"
                else
                  # Compute CER
                  CER_OUTPUT=$(cer-diff --sha "$SHA256" /tmp/actual.json /tmp/baseline.json --threshold "$THRESHOLD")
                  EXIT_CODE=$?

                  if [ $EXIT_CODE -eq 0 ]; then
                    PASS_COUNT=$((PASS_COUNT + 1))
                  else
                    FAIL_COUNT=$((FAIL_COUNT + 1))
                  fi

                  RESULT="$CER_OUTPUT"
                fi
              fi

              # Write result to JSONL
              echo "$RESULT" >> "/regression/results/shard-${SHARD_INDEX}.jsonl"

              # Cleanup
              rm -f "/tmp/${pdf_name}" /tmp/actual.json /tmp/baseline.json
            done < /tmp/shard_docs.txt

            echo "=========================================="
            echo "Shard $SHARD_INDEX complete"
            echo "Processed: $PROCESSED"
            echo "Passed: $PASS_COUNT"
            echo "Failed: $FAIL_COUNT"
            echo "=========================================="

            # Merge shard results into main output
            if [ -f "/regression/results/shard-${SHARD_INDEX}.jsonl" ]; then
              cat "/regression/results/shard-${SHARD_INDEX}.jsonl" >> "/regression/regression-results.jsonl"
            fi

            # Fail shard if any document exceeded threshold
            if [ "$FAIL_COUNT" -gt 0 ] && [ "$REGRESSION_MODE" = "gate" ]; then
              echo "ERROR: $FAIL_COUNT documents exceeded CER threshold"
              exit 1
            fi

        env:
          - name: ARMOR_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: b2-readonly
                key: access-key-id
                optional: true
          - name: ARMOR_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: b2-readonly
                key: secret-access-key
                optional: true
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: shared-artifacts
            mountPath: /shared
          - name: regression-results
            mountPath: /regression
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        outputs:
          artifacts:
            - name: shard-results
              path: /regression/results/shard-{{inputs.parameters.shard-index}}.jsonl
              optional: true

    # === Regression Corpus Exit Handler ===
    - name: regression-corpus-exit
      script:
        image: debian:12
        command: [sh]
        source: |
          #!/bin/sh
          set -e
          echo "=== Regression Corpus Exit Report ==="
          echo "Commit: {{workflow.parameters.commit-sha}}"
          echo "Regression mode: {{workflow.parameters.regression-mode}}"
          echo "Results artifacts available from all shards"

          if [ -f "/regression/regression-results.jsonl" ]; then
            echo "Total results lines: $(wc -l < /regression/regression-results.jsonl)"
            echo "=== Sample results (first 5) ==="
            head -5 /regression/regression-results.jsonl || true
          fi
        volumeMounts:
          - name: regression-results
            mountPath: /regression
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      outputs:
        artifacts:
          - name: regression-results
            path: /regression/regression-results.jsonl
            optional: true

    # === Publish If Tag ===
    # On milestone tags, upload binaries to GitHub Releases
    #
    # This step activates only when the workflow's ref parameter is a version tag
    # matching v*.*.* (e.g., v0.1.0, v1.2.3). Pre-release tags (v0.1.0-rc1) are
    # uploaded with the --prerelease flag.
    #
    # The step:
    # 1. Downloads all five build artifacts from build-matrix
    # 2. Computes SHA256SUMS aggregate covering all distributed artifacts
    #    (binary archives, Python wheels, sdist, and CycloneDX SBOM)
    # 3. Extracts release notes from CHANGELOG.md
    # 4. Creates or updates the GitHub Release with all assets
    #
    # Uses Chainguard's minimal gh CLI image with jq for JSON processing.
    #
    # CRITICAL: Uses --clobber flag for idempotency - re-running the workflow
    # on the same tag overwrites assets rather than failing.
    - name: publish-if-tag
      inputs:
        artifacts:
          - name: pdftract-linux-x86_64-musl
            from: "{{tasks.build-matrix.tasks.build-linux-x86_64-musl.outputs.artifacts.pdftract-binary}}"
            path: /artifacts/pdftract-x86_64-unknown-linux-musl
          - name: pdftract-linux-aarch64-musl
            from: "{{tasks.build-matrix.tasks.build-linux-aarch64-musl.outputs.artifacts.pdftract-binary}}"
            path: /artifacts/pdftract-aarch64-unknown-linux-musl
          - name: pdftract-darwin-x86_64
            from: "{{tasks.build-matrix.tasks.build-darwin-x86_64.outputs.artifacts.pdftract-binary}}"
            path: /artifacts/pdftract-x86_64-apple-darwin
          - name: pdftract-darwin-aarch64
            from: "{{tasks.build-matrix.tasks.build-darwin-aarch64.outputs.artifacts.pdftract-binary}}"
            path: /artifacts/pdftract-aarch64-apple-darwin
          - name: pdftract-windows-x86_64-gnu
            from: "{{tasks.build-matrix.tasks.build-windows-x86_64-gnu.outputs.artifacts.pdftract-binary}}"
            path: /artifacts/pdftract-x86_64-pc-windows-gnu.exe
          - name: provenance
            from: "{{tasks.generate-provenance.outputs.artifacts.provenance}}"
            path: /tmp/multiple.intoto.jsonl
          - name: sbom
            path: /artifacts/pdftract-v{{workflow.parameters.ref}}.cdx.json
            optional: true
            # SBOM is generated by cargo cyclonedx in a separate workflow step
            # Optional: release proceeds without it if not present
      activeDeadlineSeconds: 600
      container:
        image: cgr.dev/chainguard/gh:latest
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Publishing GitHub Release"
            echo "=========================================="

            REF="{{workflow.parameters.ref}}"
            TAG="${REF#refs/tags/}"
            REPO="{{workflow.parameters.repo-url%.git}}"
            ARTIFACTS_DIR="/artifacts"
            RELEASE_NOTES_FILE="/tmp/release-notes.md"
            SHA256SUMS_FILE="/tmp/SHA256SUMS"

            echo "Tag: $TAG"
            echo "Repository: $REPO"

            # Verify all artifacts are present
            echo "=== Verifying build artifacts ==="
            EXPECTED_ARTIFACTS=(
              "pdftract-x86_64-unknown-linux-musl"
              "pdftract-aarch64-unknown-linux-musl"
              "pdftract-x86_64-apple-darwin"
              "pdftract-aarch64-apple-darwin"
              "pdftract-x86_64-pc-windows-gnu.exe"
            )

            MISSING=0
            for artifact in "${EXPECTED_ARTIFACTS[@]}"; do
              if [ ! -f "$ARTIFACTS_DIR/$artifact" ]; then
                echo "ERROR: Missing artifact: $artifact" >&2
                MISSING=$((MISSING + 1))
              else
                echo "  Found: $artifact"
              fi
            done

            if [ "$MISSING" -gt 0 ]; then
              echo "ERROR: $MISSING artifacts missing, cannot publish release" >&2
              exit 1
            fi

            # Generate SHA256SUMS aggregate
            # Covers all distributed artifacts: binary archives, Python wheels,
            # sdist, and CycloneDX SBOM. Sorted deterministically by filename.
            echo "=== Generating SHA256SUMS aggregate ==="
            cd "$ARTIFACTS_DIR"

            # Add binary archives (both default and full variants if present)
            # Pattern matches: pdftract-v*-*.tar.gz, pdftract-full-v*-*.tar.gz,
            #                   pdftract-v*-*.zip, pdftract-full-v*-*.zip
            for archive in pdftract*.tar.gz pdftract*.zip; do
              if [ -f "$archive" ]; then
                sha256sum "$archive" >> "$SHA256SUMS_FILE"
              fi
            done

            # Add Python wheels if present (abi3-tagged wheels for all platforms)
            # Pattern matches: pdftract-*-cp311-abi3-*.whl
            for wheel in pdftract-*-cp311-abi3-*.whl; do
              if [ -f "$wheel" ]; then
                sha256sum "$wheel" >> "$SHA256SUMS_FILE"
              fi
            done

            # Add Python sdist if present
            # Pattern matches: pdftract-*.tar.gz (but excludes binary archives via more specific pattern)
            for sdist in pdftract-[0-9]*.[0-9]*.[0-9]*.tar.gz; do
              if [ -f "$sdist" ] && [[ ! "$sdist" =~ pdftract-v[0-9] ]]; then
                sha256sum "$sdist" >> "$SHA256SUMS_FILE"
              fi
            done

            # Add CycloneDX SBOM if present
            # Pattern matches: pdftract-v*.cdx.json
            for sbom in pdftract-v*.cdx.json; do
              if [ -f "$sbom" ]; then
                sha256sum "$sbom" >> "$SHA256SUMS_FILE"
              fi
            done

            # Sort deterministically by filename (column 2) for reproducibility
            # Using LC_ALL=C ensures consistent sort order across locales
            echo "=== Sorting SHA256SUMS deterministically ==="
            LC_ALL=C sort -k 2 < "$SHA256SUMS_FILE" > "${SHA256SUMS_FILE}.sorted"
            mv "${SHA256SUMS_FILE}.sorted" "$SHA256SUMS_FILE"

            echo "=== SHA256SUMS contents ==="
            cat "$SHA256SUMS_FILE"

            # Verify the checksums locally before signing
            echo "=== Verifying SHA256SUMS ==="
            if sha256sum --check "$SHA256SUMS_FILE"; then
              echo "SHA256SUMS verification passed"
            else
              echo "ERROR: SHA256SUMS verification failed" >&2
              exit 1
            fi

            # Extract release notes from CHANGELOG
            echo "=== Extracting release notes ==="
            if [ -f "/workspace/tools/extract-release-notes.sh" ]; then
              /workspace/tools/extract-release-notes.sh "$TAG" "/workspace/CHANGELOG.md" > "$RELEASE_NOTES_FILE"
            else
              # Fallback if script not found
              cat > "$RELEASE_NOTES_FILE" <<EOF
              ## Release $TAG

              See [PR history](https://github.com/jedarden/pdftract/commits/$TAG) for detailed changes.
              EOF
            fi
            echo "Release notes:"
            cat "$RELEASE_NOTES_FILE"

            # Detect pre-release tags (e.g., v0.1.0-rc1, v0.1.0-alpha.1)
            PRERELEASE_FLAG=""
            if [[ "$TAG" =~ -[a-zA-Z] ]]; then
              PRERELEASE_FLAG="--prerelease"
              echo "Pre-release tag detected, will mark as pre-release"
            fi

            # Configure git for gh auth
            git config --global credential.helper store
            echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials

            # Create or update release
            echo "=== Creating/updating GitHub release ==="
            PROVENANCE_FILE="/tmp/multiple.intoto.jsonl"

            # Collect all release artifacts for upload
            # Includes binary archives, Python wheels, sdist, SBOM, SHA256SUMS, and provenance
            echo "=== Collecting release artifacts ==="
            UPLOAD_FILES=("$SHA256SUMS_FILE" "$PROVENANCE_FILE")

            # Add all binary archives (tar.gz and zip)
            for archive in "$ARTIFACTS_DIR"/pdftract*.tar.gz "$ARTIFACTS_DIR"/pdftract*.zip; do
              if [ -f "$archive" ]; then
                UPLOAD_FILES+=("$archive")
              fi
            done

            # Add all Python wheels
            for wheel in "$ARTIFACTS_DIR"/pdftract-*-cp311-abi3-*.whl; do
              if [ -f "$wheel" ]; then
                UPLOAD_FILES+=("$wheel")
              fi
            done

            # Add Python sdist (exclude version-prefixed archives)
            for sdist in "$ARTIFACTS_DIR"/pdftract-[0-9]*.[0-9]*.[0-9]*.tar.gz; do
              if [ -f "$sdist" ] && [[ ! "$(basename "$sdist")" =~ ^pdftract-v[0-9] ]]; then
                UPLOAD_FILES+=("$sdist")
              fi
            done

            # Add CycloneDX SBOM
            for sbom in "$ARTIFACTS_DIR"/pdftract-v*.cdx.json; do
              if [ -f "$sbom" ]; then
                UPLOAD_FILES+=("$sbom")
              fi
            done

            echo "Artifacts to upload (${#UPLOAD_FILES[@]} total):"
            printf "  - %s\n" "${UPLOAD_FILES[@]}"

            if gh release view "$TAG" --repo "$REPO" &>/dev/null; then
              echo "Release $TAG already exists, updating assets"
              gh release upload "$TAG" "${UPLOAD_FILES[@]}" --repo "$REPO" --clobber
            else
              echo "Creating new release $TAG"
              gh release create "$TAG" \
                --repo "$REPO" \
                --title "$TAG" \
                --notes-file "$RELEASE_NOTES_FILE" \
                $PRERELEASE_FLAG

              # Upload assets to the newly created release
              echo "=== Uploading release assets ==="
              gh release upload "$TAG" "${UPLOAD_FILES[@]}" --repo "$REPO"
            fi

            # Verify release
            echo "=== Verifying release ==="
            gh release view "$TAG" --repo "$REPO"

            echo "=========================================="
            echo "Release published successfully"
            echo "URL: https://github.com/jedarden/pdftract/releases/tag/$TAG"
            echo "=========================================="
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-pdftract-release
                key: GH_TOKEN
                optional: true
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi

    # === Generate Provenance ===
    # Generates SLSA Level 3 build provenance in in-toto v1 format
    # Creates multiple.intoto.jsonl with subjects for all binary artifacts
    - name: generate-provenance
      inputs:
        artifacts:
          - name: pdftract-linux-x86_64-musl
            from: "{{tasks.build-matrix.tasks.build-linux-x86_64-musl.outputs.artifacts.pdftract-binary}}"
            path: /artifacts/pdftract-x86_64-unknown-linux-musl
          - name: pdftract-linux-aarch64-musl
            from: "{{tasks.build-matrix.tasks.build-linux-aarch64-musl.outputs.artifacts.pdftract-binary}}"
            path: /artifacts/pdftract-aarch64-unknown-linux-musl
          - name: pdftract-darwin-x86_64
            from: "{{tasks.build-matrix.tasks.build-darwin-x86_64.outputs.artifacts.pdftract-binary}}"
            path: /artifacts/pdftract-x86_64-apple-darwin
          - name: pdftract-darwin-aarch64
            from: "{{tasks.build-matrix.tasks.build-darwin-aarch64.outputs.artifacts.pdftract-binary}}"
            path: /artifacts/pdftract-aarch64-apple-darwin
          - name: pdftract-windows-x86_64-gnu
            from: "{{tasks.build-matrix.tasks.build-windows-x86_64-gnu.outputs.artifacts.pdftract-binary}}"
            path: /artifacts/pdftract-x86_64-pc-windows-gnu.exe
      activeDeadlineSeconds: 300
      container:
        image: cgr.dev/chainguard/jq:latest
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Generating SLSA Level 3 Provenance"
            echo "=========================================="

            COMMIT_SHA="{{workflow.parameters.commit-sha}}"
            REF="{{workflow.parameters.ref}}"
            TAG="${REF#refs/tags/}"
            REPO="{{workflow.parameters.repo-url%.git}}"
            ARTIFACTS_DIR="/artifacts"
            PROVENANCE_FILE="/tmp/multiple.intoto.jsonl"

            echo "Commit: $COMMIT_SHA"
            echo "Tag: $TAG"
            echo "Repository: $REPO"

            # Compute digest for each artifact
            echo "=== Computing artifact digests ==="
            SUBJECTS=""

            EXPECTED_ARTIFACTS=(
              "pdftract-x86_64-unknown-linux-musl"
              "pdftract-aarch64-unknown-linux-musl"
              "pdftract-x86_64-apple-darwin"
              "pdftract-aarch64-apple-darwin"
              "pdftract-x86_64-pc-windows-gnu.exe"
            )

            for artifact in "${EXPECTED_ARTIFACTS[@]}"; do
              if [ ! -f "$ARTIFACTS_DIR/$artifact" ]; then
                echo "ERROR: Missing artifact: $artifact" >&2
                exit 1
              fi

              DIGEST=$(sha256sum "$ARTIFACTS_DIR/$artifact" | cut -d' ' -f1)
              echo "  $artifact: $DIGEST"

              # Build subject entry
              if [ -n "$SUBJECTS" ]; then
                SUBJECTS="$SUBJECTS,"
              fi
              SUBJECTS="$SUBJECTS{\"name\":\"$artifact\",\"digest\":{\"sha256\":\"$DIGEST\"}}"
            done

            # Get Cargo.lock hash
            CARGO_LOCK_HASH=""
            if [ -f "/workspace/Cargo.lock" ]; then
              CARGO_LOCK_HASH=$(sha256sum /workspace/Cargo.lock | cut -d' ' -f1)
              echo "Cargo.lock: $CARGO_LOCK_HASH"
            fi

            # Set reproducible timestamp from git commit (SOURCE_DATE_EPOCH)
            # This ensures two runs against the same tag produce identical provenance
            cd /workspace
            SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$COMMIT_SHA" 2>/dev/null || echo 0)
            BUILD_TIMESTAMP=$(date -u -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH"
            echo "BUILD_TIMESTAMP: $BUILD_TIMESTAMP"

            # Build invocation ID (reproducible from commit + tag)
            INVOCATION_ID="sha256-${COMMIT_SHA}-${TAG}"

            # Create SLSA Provenance v1.0 predicate
            echo "=== Generating in-toto statement ==="
            jq -n \
              --arg type "https://in-toto.io/Statement/v1" \
              --arg predicateType "https://slsa.dev/provenance/v1.0" \
              --arg subjects "$SUBJECTS" \
              --arg buildType "https://argoproj.io/argo-workflows@v1" \
              --arg builderId "https://iad-ci-oidc.ardenone.com/argo-workflows/pdftract-ci" \
              --arg invocationId "$INVOCATION_ID" \
              --arg timestamp "$BUILD_TIMESTAMP" \
              --arg commitSha "$COMMIT_SHA" \
              --arg repoUrl "$REPO" \
              --arg cargoLockHash "$CARGO_LOCK_HASH" \
              '{
                "_type": $type,
                "predicateType": $predicateType,
                "subject": ($subjects | split(",") | map(fromjson)),
                "predicate": {
                  "buildDefinition": {
                    "buildType": $buildType,
                    "externalParameters": {
                      "tag": $commitSha,
                      "source": $repoUrl
                    },
                    "internalParameters": {
                      "workflow": "pdftract-ci",
                      "ref": $commitSha
                    },
                    "resolvedDependencies": [
                      {
                        "uri": ("git+" + $repoUrl + "@" + $commitSha),
                        "digest": {
                          "sha1": $commitSha
                        }
                      },
                      {
                        "uri": "Cargo.lock",
                        "digest": {
                          "sha256": $cargoLockHash
                        }
                      }
                    ]
                  },
                  "runDetails": {
                    "builder": {
                      "id": $builderId,
                      "version": "1.0"
                    },
                    "metadata": {
                      "invocationId": $invocationId,
                      "startedOn": $timestamp
                    }
                  }
                }
              }' > "$PROVENANCE_FILE"

            echo "=== Provenance generated ==="
            cat "$PROVENANCE_FILE" | jq '.'

            # Validate JSON structure
            if ! jq empty "$PROVENANCE_FILE" 2>/dev/null; then
              echo "ERROR: Generated invalid JSON" >&2
              exit 1
            fi

            echo "=========================================="
            echo "SLSA provenance generated successfully"
            echo "Output: $PROVENANCE_FILE"
            echo "=========================================="
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        outputs:
          artifacts:
            - name: provenance
              path: /tmp/multiple.intoto.jsonl

    # === Verify Provenance ===
    # Smoke test validation of generated SLSA provenance
    # Downloads slsa-verifier and validates structure (not full crypto)
    - name: verify-provenance
      inputs:
        artifacts:
          - name: provenance
            from: "{{tasks.generate-provenance.outputs.artifacts.provenance}}"
            path: /tmp/provenance.jsonl
      activeDeadlineSeconds: 300
      container:
        image: debian:12
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Verifying SLSA Provenance"
            echo "=========================================="

            PROVENANCE_FILE="/tmp/provenance.jsonl"

            if [ ! -f "$PROVENANCE_FILE" ]; then
              echo "ERROR: Provenance file not found" >&2
              exit 1
            fi

            echo "=== Checking JSON structure ==="
            if ! jq empty "$PROVENANCE_FILE" 2>/dev/null; then
              echo "ERROR: Invalid JSON in provenance" >&2
              exit 1
            fi

            echo "=== Validating SLSA v1.0 fields ==="

            # Check required top-level fields
            STATEMENT_TYPE=$(jq -r '._type' "$PROVENANCE_FILE")
            if [ "$STATEMENT_TYPE" != "https://in-toto.io/Statement/v1" ]; then
              echo "ERROR: Invalid _type: $STATEMENT_TYPE" >&2
              exit 1
            fi
            echo "  ✓ _type: $STATEMENT_TYPE"

            PREDICATE_TYPE=$(jq -r '.predicateType' "$PROVENANCE_FILE")
            if [ "$PREDICATE_TYPE" != "https://slsa.dev/provenance/v1.0" ]; then
              echo "ERROR: Invalid predicateType: $PREDICATE_TYPE" >&2
              exit 1
            fi
            echo "  ✓ predicateType: $PREDICATE_TYPE"

            # Check subjects exist and have digests
            SUBJECT_COUNT=$(jq '.subject | length' "$PROVENANCE_FILE")
            if [ "$SUBJECT_COUNT" -eq 0 ]; then
              echo "ERROR: No subjects in provenance" >&2
              exit 1
            fi
            echo "  ✓ subjects: $SUBJECT_COUNT artifacts"

            # Verify each subject has sha256 digest
            for i in $(seq 0 $((SUBJECT_COUNT - 1))); do
              DIGEST=$(jq -r ".subject[$i].digest.sha256" "$PROVENANCE_FILE")
              if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
                echo "ERROR: Subject $i missing sha256 digest" >&2
                exit 1
              fi
            done
            echo "  ✓ All subjects have sha256 digests"

            # Check buildDefinition.buildType
            BUILD_TYPE=$(jq -r '.predicate.buildDefinition.buildType' "$PROVENANCE_FILE")
            if [ -z "$BUILD_TYPE" ] || [ "$BUILD_TYPE" = "null" ]; then
              echo "ERROR: Missing buildType" >&2
              exit 1
            fi
            echo "  ✓ buildType: $BUILD_TYPE"

            # Check resolvedDependencies
            DEP_COUNT=$(jq '.predicate.buildDefinition.resolvedDependencies | length' "$PROVENANCE_FILE")
            if [ "$DEP_COUNT" -eq 0 ]; then
              echo "WARN: No resolvedDependencies found" >&2
            else
              echo "  ✓ resolvedDependencies: $DEP_COUNT entries"
            fi

            # Check builder.id
            BUILDER_ID=$(jq -r '.predicate.runDetails.builder.id' "$PROVENANCE_FILE")
            if [ -z "$BUILDER_ID" ] || [ "$BUILDER_ID" = "null" ]; then
              echo "ERROR: Missing builder.id" >&2
              exit 1
            fi
            echo "  ✓ builder.id: $BUILDER_ID"

            echo "=== Installing slsa-verifier ==="
            apt-get update -qq
            apt-get install -y curl

            # Download slsa-verifier
            SLSA_VERIFIER_VERSION="2.6.0"
            curl -sSL "https://github.com/slsa-framework/slsa-verifier/releases/download/v${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64" -o /usr/local/bin/slsa-verifier
            chmod +x /usr/local/bin/slsa-verifier

            echo "=== Running slsa-verifier smoke test ==="
            # Note: Full cryptographic verification requires OIDC issuer registration
            # This smoke test validates the structure is parseable
            if slsa-verifier verify-artifact \
              --provenance-path "$PROVENANCE_FILE" \
              --source-uri "github.com/jedarden/pdftract" \
              --source-tag "{{workflow.parameters.ref}}" 2>&1 | grep -q "level 3"; then
              echo "  ✓ slsa-verifier validated structure"
            else
              echo "  WARN: Full cryptographic verification requires OIDC issuer registration"
              echo "  See ADR-009 for iad-ci cluster OIDC setup"
            fi

            echo "=========================================="
            echo "Provenance verification complete"
            echo "=========================================="
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
