# pdftract-ci WorkflowTemplate
#
# This template orchestrates the CI/CD pipeline for pdftract, a Rust PDF text extraction
# library with PyO3 Python bindings and a CLI binary. The pipeline builds, tests, runs
# quality checks, benchmarks, and publishes releases across multiple targets.
#
# === Webhook Payload Schema ===
# Triggered via GitHub webhook -> WorkflowEventBinding (out of scope for this bead).
# Expected webhook payload schema:
#
#   {
#     "ref": "refs/heads/main" | "refs/tags/v0.1.0",
#     "repository": {
#       "full_name": "jedarden/pdftract",
#       "html_url": "https://github.com/jedarden/pdftract"
#     },
#     "head_commit": {
#       "id": "abc123...",
#       "message": "Commit message"
#     },
#     "sender": {
#       "login": "username"
#     }
#   }
#
# === Parameter Reference ===
# - commit-sha: Full Git commit SHA (40 hex chars)
# - ref: Git ref (branch: "refs/heads/*", tag: "refs/tags/v*")
# - repo-url: GitHub repository URL
# - is-tag: Boolean ("true" if ref is a tag, "false" otherwise)
#
# === DAG Structure ===
# setup -> [parallel: build-matrix, test-matrix, quality-matrix, bench-matrix] -> publish-if-tag
#
# - setup: Clone repo, fetch dependencies, warm cargo cache
# - build-matrix: Cross-compile for 5 targets (x86_64/aarch64 Linux musl, macOS x64/ARM64, Windows x64)
# - test-matrix: Run unit tests across feature combinations (default, full, with OCR)
# - quality-matrix: Seven Tier 1 quality gates (clippy-fmt, msrv-check, cargo-audit, cargo-deny, cargo-bloat, memory-ceiling, schema-gen)
# - bench-matrix: Performance benchmarks (cargo bench) against fixture corpus
# - publish-if-tag: On tags only, upload binaries to GitHub Releases
#
# === Subsequent Phase 0 Beads ===
# Each bead fills in a distinct set of templates without colliding:
# - pdftract-xxxx: setup step, volume mount points, cache warming logic
# - pdftract-yyyy: build-matrix templates (5 target builds with cross)
# - pdftract-zzzz: test-matrix templates (feature combinations)
# - pdftract-wwww: quality-matrix templates (clippy-fmt, msrv-check, cargo-audit, cargo-deny, cargo-bloat)
# - pdftract-vvvv: bench-matrix templates (cargo bench)
# - pdftract-uuuu: publish-if-tag template (gh release create)
#
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pdftract-ci
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: pdftract-ci
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: pdftract
spec:
  entrypoint: pipeline
  serviceAccountName: argo-workflow

  podGC: OnPodCompletion
  ttlSecondsAfterFinished:
    success: 1800
    failure: 7200

  arguments:
    parameters:
      - name: commit-sha
        value: ""
        description: "Full Git commit SHA (40 hex chars)"
      - name: ref
        value: "refs/heads/main"
        description: "Git ref (branch: 'refs/heads/*', tag: 'refs/tags/v*')"
      - name: repo-url
        value: "https://github.com/jedarden/pdftract.git"
        description: "GitHub repository URL"
      - name: is-tag
        value: "false"
        description: "Boolean ('true' if ref is a tag, 'false' otherwise)"
      - name: regression-mode
        value: "gate"
        description: "Regression mode: 'gate' (PR) fails on CER > 0.5%, 'update' (merge) refreshes baselines"
      - name: pr-number
        value: ""
        description: "Pull request number for posting benchmark comments (empty skips commenting)"
      - name: proptest-seed
        value: ""
        description: "Proptest seed for reproducibility (empty = auto-generate)"
      - name: proptest-cases
        value: "10000"
        description: "Number of proptest cases per module (default: 10000)"

  volumeClaimTemplates:
    - metadata:
        name: cargo-cache
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sata-large
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sata-large
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: shared-artifacts
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sata-large
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: regression-results
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sata-large
        resources:
          requests:
            storage: 2Gi

  volumes:
    - name: docker-config
      secret:
        secretName: docker-hub-registry
        items:
          - key: .dockerconfigjson
            path: config.json

  podMetadata:
    labels:
      app.kubernetes.io/name: pdftract-ci
      commit-sha: "{{workflow.parameters.commit-sha}}"

  podSpecPatch: |
    imagePullSecrets:
      - name: docker-hub-registry
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000

  templates:
    # === Top-level DAG ===
    # Setup runs first, then all matrices run in parallel, then publish if tagged
    - name: pipeline
      dag:
        onExit: on-exit
        tasks:
          - name: setup
            template: setup

          - name: build-matrix
            template: build-matrix
            dependencies: [setup]

          - name: test-matrix
            template: test-matrix
            dependencies: [setup]

          - name: quality-matrix
            template: quality-matrix
            dependencies: [setup]

          - name: wer-gate
            template: wer-gate
            dependencies: [setup, build-matrix]
            arguments:
              artifacts:
                - name: pdftract-binary
                  from: "{{tasks.build-matrix.tasks.build-linux-x86_64-musl.outputs.artifacts.pdftract-binary}}"

          - name: bench-matrix
            template: bench-matrix
            dependencies: [setup]
            arguments:
              artifacts:
                - name: pdftract-binary
                  from: "{{tasks.build-matrix.tasks.build-linux-x86_64-musl.outputs.artifacts.pdftract-binary}}"

          - name: benchmark-pr-comment
            template: benchmark-pr-comment
            dependencies: [bench-matrix]
            when: "{{workflow.parameters.pr-number}} != \"\""
            arguments:
              artifacts:
                - name: benchmark-comment
                  from: "{{tasks.bench-matrix.outputs.artifacts.benchmark-comment}}"

          - name: regression-corpus
            template: regression-corpus
            dependencies: [build-matrix]

          - name: generate-provenance
            template: generate-provenance
            dependencies: [build-matrix]
            when: "{{workflow.parameters.is-tag}} == true"

          - name: verify-provenance
            template: verify-provenance
            dependencies: [generate-provenance]
            when: "{{workflow.parameters.is-tag}} == true"

          - name: publish-if-tag
            template: publish-if-tag
            dependencies: [build-matrix, test-matrix, quality-matrix, wer-gate, bench-matrix, regression-corpus, verify-provenance]
            when: "{{workflow.parameters.is-tag}} == true"
            arguments:
              artifacts:
                - name: provenance
                  from: "{{tasks.generate-provenance.outputs.artifacts.provenance}}"

    # === Exit Handler ===
    # Reports workflow status to GitHub PR via argo-workflows-pr-status operator
    # Posts JSON payload to cluster-local service; operator transforms to GitHub Check Run
    - name: on-exit
      script:
        image: curlimages/curl:latest
        command: [sh]
        source: |
          #!/bin/sh
          set -e

          echo "=== Workflow Exit Report ==="
          echo "Workflow: {{workflow.name}}"
          echo "Commit: {{workflow.parameters.commit-sha}}"
          echo "Ref: {{workflow.parameters.ref}}"
          echo "Phase: {{workflow.status}}"
          echo "Started: {{workflow.creationTimestamp}}"
          echo "Duration: $(({{workflow.status.finishedAt}} - {{workflow.creationTimestamp}})) seconds"

          # Build step outcomes map
          # For matrix templates, we expand each item as a separate check
          STEPS='{}'

          # Helper to add step outcome
          add_step() {
            STEP_NAME="$1"
            PHASE="$2"
            STEPS=$(echo "$STEPS" | jq --arg name "$STEP_NAME" --arg phase "$PHASE" '. + {($name): $phase}')
          }

          # Determine phase for each step from workflow status
          # Note: In real execution, this would query the workflow status
          # For now, we report based on overall workflow phase
          WORKFLOW_PHASE="{{workflow.status}}"

          # Build step outcomes from workflow tasks
          # This is a simplified version - in production, parse workflow.status.nodes
          add_step "setup" "Succeeded"
          add_step "build-linux-x86_64-musl" "$WORKFLOW_PHASE"
          add_step "build-linux-aarch64-musl" "$WORKFLOW_PHASE"
          add_step "build-darwin-x86_64" "$WORKFLOW_PHASE"
          add_step "build-darwin-aarch64" "$WORKFLOW_PHASE"
          add_step "build-windows-x86_64-gnu" "$WORKFLOW_PHASE"
          add_step "test-glibc" "$WORKFLOW_PHASE"
          add_step "test-musl" "$WORKFLOW_PHASE"
          add_step "clippy-fmt" "$WORKFLOW_PHASE"
          add_step "msrv-check" "$WORKFLOW_PHASE"
          add_step "cargo-audit" "$WORKFLOW_PHASE"
          add_step "cargo-deny" "$WORKFLOW_PHASE"
          add_step "cargo-bloat" "$WORKFLOW_PHASE"
          add_step "memory-ceiling" "$WORKFLOW_PHASE"
          add_step "log-policy-check" "$WORKFLOW_PHASE"
          add_step "schema-gen" "$WORKFLOW_PHASE"
          add_step "wer-gate" "$WORKFLOW_PHASE"
          add_step "bench-matrix" "$WORKFLOW_PHASE"
          add_step "regression-corpus" "$WORKFLOW_PHASE"

          # Build artifacts list
          ARTIFACTS='["workflow-metadata.json","bloat-report.json","memory-report.json","audit-report.json","deny-report.json","benchmark-results.json","benchmark-comment.md"]'

          # Calculate duration
          START_TIME="{{workflow.creationTimestamp}}"
          END_TIME="{{workflow.status.finishedAt}}"
          START_EPOCH=$(date -d "$START_TIME" +%s 2>/dev/null || echo 0)
          END_EPOCH=$(date -d "$END_TIME" +%s 2>/dev/null || echo $(date +%s))
          DURATION=$((END_EPOCH - START_EPOCH))

          # Build JSON payload
          PAYLOAD=$(jq -n \
            --arg commit_sha "{{workflow.parameters.commit-sha}}" \
            --arg ref "{{workflow.parameters.ref}}" \
            --arg workflow_phase "$WORKFLOW_PHASE" \
            --arg started_at "$START_TIME" \
            --argjson duration_seconds "$DURATION" \
            --argjson step_outcomes "$STEPS" \
            --argjson artifacts "$ARTIFACTS" \
            --arg dashboard_url "https://argo-ci.ardenone.com/workflows/argo-workflows/{{workflow.name}}" \
            '{
              commit_sha: $commit_sha,
              ref: $ref,
              workflow_phase: $workflow_phase,
              started_at: $started_at,
              duration_seconds: $duration_seconds,
              step_outcomes: $step_outcomes,
              artifacts: $artifacts,
              dashboard_url: $dashboard_url
            }')

          echo "=== Posting status to PR ==="
          echo "Payload:"
          echo "$PAYLOAD" | jq '.'

          # Post to pr-status operator (cluster-local service)
          # Use cluster DNS directly for low-latency intra-cluster traffic
          STATUS_URL="https://argo-pr-status.argo-workflows.svc.cluster.local/v1/report"

          if curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$STATUS_URL"; then
            echo ""
            echo "=== Status posted successfully ==="
          else
            echo ""
            echo "WARN: Failed to post status (operator may not be deployed yet)"
            echo "This is expected during initial CI setup"
          fi
      activeDeadlineSeconds: 60

    # === Setup Step ===
    # Clones repo, fetches dependencies, warms cargo cache, uploads workflow metadata
    #
    # CRITICAL: All cargo commands in this workflow MUST use --locked (or --locked --frozen)
    # to enforce the workspace Cargo.lock policy. See CONTRIBUTING.md for details.
    - name: setup
      activeDeadlineSeconds: 600
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            set -e

            echo "=========================================="
            echo "Setup: Cloning repo and caching dependencies"
            echo "=========================================="

            # Install git
            apk add --no-cache git

            REPO_URL="{{workflow.parameters.repo-url}}"
            COMMIT_SHA="{{workflow.parameters.commit-sha}}"
            REF="{{workflow.parameters.ref}}"

            echo "Repo URL: $REPO_URL"
            echo "Commit SHA: $COMMIT_SHA"
            echo "Ref: $REF"

            # Clone repository
            echo "=== Cloning repository ==="
            git clone "$REPO_URL" /workspace

            cd /workspace

            # Checkout specific commit
            echo "=== Checking out commit ==="
            git checkout "$COMMIT_SHA"

            # Get git info for metadata
            GIT_REMOTE_URL=$(git remote get-url origin)
            GIT_DESCRIBE=$(git describe --always --abbrev=40 --dirty 2>/dev/null || echo "$COMMIT_SHA")
            GIT_AUTHOR=$(git log -1 --format='%an <%ae>' "$COMMIT_SHA" 2>/dev/null || echo "unknown")
            GIT_COMMIT_MSG=$(git log -1 --format='%s' "$COMMIT_SHA" 2>/dev/null || echo "unknown")

            echo "Git remote: $GIT_REMOTE_URL"
            echo "Git describe: $GIT_DESCRIBE"
            echo "Git author: $GIT_AUTHOR"
            echo "Git commit message: $GIT_COMMIT_MSG"

            # Get workflow template SHA (this file's commit)
            PDFTRACT_CI_SHA=$(git log -1 --format='%H' .ci/argo-workflows/pdftract-ci.yaml 2>/dev/null || echo "$COMMIT_SHA")

            # Record container image versions for reproducibility
            CONTAINER_IMAGES='{
              "build:x86_64-unknown-linux-musl": "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main",
              "build:aarch64-unknown-linux-musl": "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main",
              "build:x86_64-apple-darwin": "ghcr.io/cross-rs/x86_64-apple-darwin:main",
              "build:aarch64-apple-darwin": "ghcr.io/cross-rs/aarch64-apple-darwin:main",
              "build:x86_64-pc-windows-gnu": "ghcr.io/cross-rs/x86_64-pc-windows-gnu:main",
              "test:glibc": "rust:1.83-bookworm",
              "test:musl": "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main",
              "quality": "pdftract-test-glibc:1.78",
              "msrv": "rust:1.78-slim",
              "bench": "python:3.11-slim-bookworm"
            }'

            # Create workflow metadata artifact
            echo "=== Creating workflow metadata artifact ==="
            cat > /workspace/workflow-metadata.json <<EOF
            {
              "commit_sha": "$COMMIT_SHA",
              "ref": "$REF",
              "git_remote_url": "$GIT_REMOTE_URL",
              "git_describe": "$GIT_DESCRIBE",
              "git_author": "$GIT_AUTHOR",
              "git_commit_message": $(echo "$GIT_COMMIT_MSG" | jq -Rs .),
              "pdftract_ci_template_sha": "$PDFTRACT_CI_SHA",
              "workflow_parameters": {
                "commit-sha": "$COMMIT_SHA",
                "ref": "$REF",
                "repo-url": "$REPO_URL",
                "is-tag": "{{workflow.parameters.is-tag}}",
                "regression-mode": "{{workflow.parameters.regression-mode}}",
                "pr-number": "{{workflow.parameters.pr-number}}",
                "proptest-seed": "{{workflow.parameters.proptest-seed}}",
                "proptest-cases": "{{workflow.parameters.proptest-cases}}"
              },
              "container_images": $CONTAINER_IMAGES,
              "workflow_name": "{{workflow.name}}",
              "argo_ui_url": "https://argo-ci.ardenone.com/workflows/argo-workflows/{{workflow.name}}",
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
            EOF

            echo "=== Workflow metadata ==="
            cat /workspace/workflow-metadata.json | jq '.'

            echo ""
            echo "=== Repository ready ==="
            echo "Workspace: /workspace"
            echo "Cargo cache: /cache/cargo"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
      outputs:
        artifacts:
          - name: workflow-metadata
            path: /workspace/workflow-metadata.json

    # === Build Matrix ===
    # Cross-compile for 5 targets using cross (Docker-based)
    # Targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl,
    #          x86_64-apple-darwin, aarch64-apple-darwin, x86_64-pc-windows-gnu
    - name: build-matrix
      activeDeadlineSeconds: 3600
      dag:
        onExit: build-matrix-exit
        tasks:
          - name: build-linux-x86_64-musl
            template: build-target
            arguments:
              parameters:
                - name: target
                  value: "x86_64-unknown-linux-musl"
                - name: cross-image
                  value: "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main"
                - name: strip-cmd
                  value: "x86_64-linux-musl-strip"
                - name: ext
                  value: ""
            continueOn:
              failed: true
          - name: build-linux-aarch64-musl
            template: build-target
            arguments:
              parameters:
                - name: target
                  value: "aarch64-unknown-linux-musl"
                - name: cross-image
                  value: "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"
                - name: strip-cmd
                  value: "aarch64-linux-musl-strip"
                - name: ext
                  value: ""
            continueOn:
              failed: true
          - name: build-darwin-x86_64
            template: build-target
            arguments:
              parameters:
                - name: target
                  value: "x86_64-apple-darwin"
                - name: cross-image
                  value: "ghcr.io/cross-rs/x86_64-apple-darwin:main"
                - name: strip-cmd
                  value: "x86_64-apple-darwin-strip"
                - name: ext
                  value: ""
            continueOn:
              failed: true
          - name: build-darwin-aarch64
            template: build-target
            arguments:
              parameters:
                - name: target
                  value: "aarch64-apple-darwin"
                - name: cross-image
                  value: "ghcr.io/cross-rs/aarch64-apple-darwin:main"
                - name: strip-cmd
                  value: "aarch64-apple-darwin-strip"
                - name: ext
                  value: ""
            continueOn:
              failed: true
          - name: build-windows-x86_64-gnu
            template: build-target
            arguments:
              parameters:
                - name: target
                  value: "x86_64-pc-windows-gnu"
                - name: cross-image
                  value: "ghcr.io/cross-rs/x86_64-pc-windows-gnu:main"
                - name: strip-cmd
                  value: "x86_64-w64-mingw32-strip"
                - name: ext
                  value: ".exe"
            continueOn:
              failed: true

    # === Build Target Template ===
    # Single target build using cross (Docker-based)
    # Uses ghcr.io/cross-rs/<target>:main images which have cross pre-installed
    - name: build-target
      inputs:
        parameters:
          - name: target
          - name: cross-image
          - name: strip-cmd
          - name: ext
      activeDeadlineSeconds: 3600
      container:
        image: "{{inputs.parameters.cross-image}}"
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            TARGET="{{inputs.parameters.target}}"
            STRIP_CMD="{{inputs.parameters.strip-cmd}}"
            EXT="{{inputs.parameters.ext}}"

            echo "=========================================="
            echo "Building pdftract for target: $TARGET"
            echo "=========================================="

            cd /workspace

            # Set reproducible build timestamp
            export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct 2>/dev/null || echo 0)
            export CARGO_HOME="/cache/cargo/registry"
            export CARGO_TARGET_DIR="/cache/cargo/target-$TARGET"

            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
            echo "CARGO_HOME=$CARGO_HOME"
            echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR"

            echo "=== Running cargo build with cross ==="
            cross build --release --target "$TARGET" --locked --features default,serve,decrypt

            BINARY_PATH="target/$TARGET/release/pdftract$EXT"

            if [ ! -f "$BINARY_PATH" ]; then
              echo "ERROR: Binary not found at $BINARY_PATH" >&2
              echo "Contents of target directory:"
              ls -la "target/$TARGET/release/" || true
              exit 1
            fi

            echo "=== Binary size before strip ==="
            ls -lh "$BINARY_PATH"

            echo "=== Stripping binary ==="
            "$STRIP_CMD" "$BINARY_PATH" || {
              echo "WARNING: Strip command failed, continuing with unstripped binary" >&2
            }

            echo "=== Binary size after strip ==="
            ls -lh "$BINARY_PATH"

            mkdir -p /artifacts
            cp "$BINARY_PATH" "/artifacts/pdftract-$TARGET$EXT"

            echo "=== Final artifact ==="
            ls -lh /artifacts/

            SIZE=$(stat -c%s "/artifacts/pdftract-$TARGET$EXT" 2>/dev/null || stat -f%z "/artifacts/pdftract-$TARGET$EXT")
            echo "Binary size: $SIZE bytes"

            if [ "$SIZE" -gt 4194304 ]; then
              echo "WARNING: Binary exceeds 4 MB budget ($SIZE bytes)"
            else
              echo "Binary within 4 MB budget"
            fi

            echo "=== Build complete ==="
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
          - name: docker-config
            mountPath: /root/.docker
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi
      outputs:
        artifacts:
          - name: pdftract-binary
            path: /artifacts/pdftract-{{inputs.parameters.target}}{{inputs.parameters.ext}}

    # === Build Matrix Exit Handler ===
    - name: build-matrix-exit
      script:
        image: alpine:3.19
        command: [sh]
        source: |
          #!/bin/sh
          echo "=== Build Matrix Exit Report ==="
          echo "Commit: {{workflow.parameters.commit-sha}}"
          echo "All binaries available as artifacts"

    # === Test Matrix ===
    # Run cargo test across feature combinations and targets
    # - glibc: All features including OCR (tesseract available on Debian)
    # - musl: Production binary feature set (no OCR, unavailable on Alpine/musl)
    # - proptest: Property tests (10,000 cases per module)
    #
    # CRITICAL: All cargo commands MUST use --locked (or --locked --frozen)
    #
    # Bead: pdftract-5gtcj (musl leg)
    # Plan section: Phase 0.3
    - name: test-matrix
      activeDeadlineSeconds: 3600
      dag:
        tasks:
          - name: test-glibc
            template: test-glibc
          - name: test-musl
            template: test-musl

    # === Test GLIBC ===
    # Run full test suite on x86_64-unknown-linux-gnu with all features including OCR
    # Uses standard Debian-based Rust image with tesseract available
    #
    # Features tested: default, all (including ocr, serve, decrypt, python)
    #
    # Memory enforcement (bf-1g1fd):
    # - Cgroup MemoryMax: 6 GB (hard ceiling on entire test run)
    # This ensures clean failure mode for memory regressions in tests.
    - name: test-glibc
      activeDeadlineSeconds: 3600
      container:
        image: rust:1.83-bookworm
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Test GLIBC (x86_64-unknown-linux-gnu)"
            echo "=========================================="

            cd /workspace
            export CARGO_HOME="/cache/cargo/registry"
            export CARGO_TARGET_DIR="/cache/cargo/target-test-glibc"
            MEMORY_MAX_MB=6144  # 6 GB cgroup cap for test suite

            # Check if cgroup v2 is available (preferred)
            if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
              echo "=== Using cgroup v2 for memory enforcement (bf-1g1fd) ==="

              # Create a child cgroup for this test run
              CGROUP_PATH="/sys/fs/cgroup/test-glibc"
              mkdir -p "$CGROUP_PATH"

              # Set memory limit
              echo "max ${MEMORY_MAX_MB}M" > "$CGROUP_PATH/memory.max"

              # Enable memory controller
              echo "+memory" > /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || true

              # Launch the tests in the cgroup
              (
                # Add current process to the cgroup
                echo $$ > "$CGROUP_PATH/cgroup.procs"

                # Set proptest seed for reproducibility
                SEED="{{workflow.parameters.proptest-seed}}"
                if [ -z "$SEED" ]; then
                  SEED=$(date +%s%N | sha256sum | head -c 16)
                  echo "Generated proptest seed: $SEED"
                else
                  echo "Using provided proptest seed: $SEED"
                fi
                export PROPTEST_SEED="$SEED"

                # Set proptest case count
                CASES="{{workflow.parameters.proptest-cases}}"
                echo "Proptest cases per module: $CASES"
                export PROPTEST_CASES="$CASES"

                echo "=== Running unit tests (default features) ==="
