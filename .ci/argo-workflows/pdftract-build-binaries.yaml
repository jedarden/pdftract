# pdftract-build-binaries WorkflowTemplate
#
# Builds 10 binary archives: 5 target triples × 2 feature variants (default, full)
# Triggered by milestone tag (vX.Y.Z). Archives are uploaded as Argo artifacts
# for the downstream pdftract-github-release template to attach to the GitHub Release.
#
# Target triples:
#   - x86_64-unknown-linux-musl
#   - aarch64-unknown-linux-musl
#   - x86_64-apple-darwin
#   - aarch64-apple-darwin
#   - x86_64-pc-windows-gnu
#
# Feature variants:
#   - default (archive name: pdftract-vX.Y.Z-<triple>.tar.gz)
#   - full (archive name: pdftract-full-vX.Y.Z-<triple>.tar.gz)
#
# Bead: pdftract-220e
# Plan section: Release Engineering / Argo WorkflowTemplates, line 3389
#
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pdftract-build-binaries
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: pdftract-build-binaries
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: pdftract
spec:
  entrypoint: build-matrix
  serviceAccountName: argo-workflow

  podGC:
    strategy: OnPodCompletion

  ttlStrategy:
    secondsAfterSuccess: 1800
    secondsAfterFailure: 7200

  arguments:
    parameters:
      - name: repo
        value: jedarden/pdftract
      - name: branch
        value: main
      - name: tag
        value: ""
        description: "Git tag (e.g., v0.1.0)"
      - name: version
        value: ""
        description: "Version extracted from tag (e.g., 0.1.0)"
      - name: commit-sha
        value: ""
        description: "Full commit SHA of the tag"

  volumeClaimTemplates:
    - metadata:
        name: cargo-cache
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sata-large
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sata-large
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: build-artifacts
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: sata-large
        resources:
          requests:
            storage: 5Gi

  volumes:
    - name: docker-config
      secret:
        secretName: docker-hub-registry
        items:
          - key: .dockerconfigjson
            path: config.json
    # === osxcross SDK Secret Volume ===
    # The osxcross-sdk Secret contains the macOS SDK tarball.
    # This Secret is pre-created in the argo-workflows namespace.
    - name: osxcross-sdk
      secret:
        secretName: osxcross-sdk
        optional: true

  podMetadata:
    labels:
      app.kubernetes.io/name: pdftract-build-binaries
      tag: "{{workflow.parameters.tag}}"

  podSpecPatch: |
    imagePullSecrets:
      - name: docker-hub-registry

  templates:
    # === Top-level DAG ===
    # Clone repo, then build all 10 variants in parallel
    - name: build-matrix
      dag:
        tasks:
          - name: setup
            template: setup

          - name: build-variant
            template: build-variant
            dependencies: [setup]
            arguments:
              parameters:
                - name: triple
                  value: "{{item.triple}}"
                - name: features
                  value: "{{item.features}}"
                - name: cross-image
                  value: "{{item.cross_image}}"
                - name: strip-cmd
                  value: "{{item.strip_cmd}}"
            withItems:
              # x86_64-unknown-linux-musl variants
              - triple: x86_64-unknown-linux-musl
                features: default
                cross_image: ghcr.io/cross-rs/x86_64-unknown-linux-musl:main
                strip_cmd: strip
              - triple: x86_64-unknown-linux-musl
                features: full
                cross_image: ghcr.io/cross-rs/x86_64-unknown-linux-musl:main
                strip_cmd: strip

              # aarch64-unknown-linux-musl variants
              - triple: aarch64-unknown-linux-musl
                features: default
                cross_image: ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
                strip_cmd: aarch64-linux-gnu-strip
              - triple: aarch64-unknown-linux-musl
                features: full
                cross_image: ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
                strip_cmd: aarch64-linux-gnu-strip

              # x86_64-apple-darwin variants (osxcross)
              - triple: x86_64-apple-darwin
                features: default
                cross_image: ghcr.io/cross-rs/x86_64-apple-darwin:main
                strip_cmd: x86_64-apple-darwin-strip
              - triple: x86_64-apple-darwin
                features: full
                cross_image: ghcr.io/cross-rs/x86_64-apple-darwin:main
                strip_cmd: x86_64-apple-darwin-strip

              # aarch64-apple-darwin variants (osxcross)
              - triple: aarch64-apple-darwin
                features: default
                cross_image: ghcr.io/cross-rs/aarch64-apple-darwin:main
                strip_cmd: aarch64-apple-darwin-strip
              - triple: aarch64-apple-darwin
                features: full
                cross_image: ghcr.io/cross-rs/aarch64-apple-darwin:main
                strip_cmd: aarch64-apple-darwin-strip

              # x86_64-pc-windows-gnu variants
              - triple: x86_64-pc-windows-gnu
                features: default
                cross_image: ghcr.io/cross-rs/x86_64-pc-windows-gnu:main
                strip_cmd: strip
              - triple: x86_64-pc-windows-gnu
                features: full
                cross_image: ghcr.io/cross-rs/x86_64-pc-windows-gnu:main
                strip_cmd: strip
            continueOn:
              failed: true

          - name: generate-sbom
            template: generate-sbom
            dependencies: [setup]

          - name: generate-provenance
            template: generate-provenance
            dependencies: [build-variant]

    # === Setup Step ===
    # Clone repo and extract version metadata
    - name: setup
      activeDeadlineSeconds: 600
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            set -e
            apk add --no-cache git

            git clone --depth 1 --branch "{{workflow.parameters.branch}}" \
              "https://x-access-token:${GH_TOKEN}@github.com/{{workflow.parameters.repo}}.git" \
              /workspace

            cd /workspace
            git checkout {{workflow.parameters.commit-sha}}

            # Extract SOURCE_DATE_EPOCH from the tag commit
            SOURCE_DATE_EPOCH=$(git show -s --format=%ct {{workflow.parameters.commit-sha}})
            echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" > /workspace/build-env.sh

            echo "Setup complete for {{workflow.parameters.tag}}"
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-webhook-secret
                key: token
        volumeMounts:
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi

    # === Generate CycloneDX SBOM ===
    # Generates CycloneDX Software Bill of Materials for the workspace
    # Produces pdftract-vX.Y.Z.cdx.json covering all Rust dependencies
    #
    # Bead: pdftract-8zbd
    # Plan section: Release Engineering / Artifact Taxonomy, line 3354
    - name: generate-sbom
      activeDeadlineSeconds: 600
      container:
        image: rust:1.83-bookworm
        command: [bash, -c]
        args:
          - |
            set -eo pipefail

            echo "=========================================="
            echo "Generating CycloneDX SBOM"
            echo "=========================================="

            cd /workspace
            export CARGO_HOME="/cache/cargo"
            export CARGO_TARGET_DIR="/workspace/target-sbom"

            TAG="{{workflow.parameters.tag}}"
            VERSION="{{workflow.parameters.version}}"
            SBOM_FILE="pdftract-v${VERSION}.cdx.json"

            # Install cargo-cyclonedx
            echo "=== Installing cargo-cyclonedx ==="
            cargo install cargo-cyclonedx --locked

            # Generate SBOMs for all workspace members with all dependencies
            # Note: cargo-cyclonedx generates separate files for each workspace member
            echo "=== Generating SBOMs for workspace ==="
            cargo cyclonedx --format json --all --spec-version 1.5

            # Merge workspace member SBOMs into a single BOM
            echo "=== Merging workspace SBOMs ==="
            mkdir -p /artifacts

            # Use jq to merge the SBOMs into a single CycloneDX 1.5 BOM
            # Each workspace member SBOM is merged, deduplicating components by purl
            jq -s '
              {
                "$schema": "http://cyclonedx.org/schema/bom-1.5.schema.json",
                "bomFormat": "CycloneDX",
                "specVersion": "1.5",
                "version": 1,
                "metadata": {
                  "type": "library",
                  "lifecycle": "published",
                  "component": {
                    "type": "library",
                    "name": "pdftract",
                    "version": "'"${VERSION}"'",
                    "purl": "pkg:cargo/pdftract@" + "'"${VERSION}"'",
                    "description": "PDF text extraction library with advanced layout analysis",
                    "externalReferences": [
                      {
                        "type": "vcs",
                        "url": "https://github.com/jedarden/pdftract.git"
                      },
                      {
                        "type": "website",
                        "url": "https://github.com/jedarden/pdftract"
                      }
                    ]
                  }
                },
                "components": ([.[].components // []] | flatten | unique_by(.["purl"]))
              }
            ' \
              crates/pdftract-core/pdftract-core.cdx.json \
              crates/pdftract-cli/pdftract-cli.cdx.json \
              crates/pdftract-py/pdftract-py.cdx.json \
              > "/artifacts/${SBOM_FILE}"

            echo "=== Installing cyclonedx-cli for validation ==="
            cargo install cyclonedx-cli --locked

            echo "=== Validating merged SBOM ==="
            cyclonedx-cli validate --input-file "/artifacts/${SBOM_FILE}"

            # Display summary
            COMPONENT_COUNT=$(jq '.components | length' "/artifacts/${SBOM_FILE}")
            echo "=== SBOM generated and validated ==="
            echo "Components: ${COMPONENT_COUNT}"
            ls -lh "/artifacts/${SBOM_FILE}"
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
      outputs:
        artifacts:
          - name: sbom
            path: /artifacts/pdftract-v{{workflow.parameters.version}}.cdx.json

    # === Build Single Variant ===
    # Builds one (triple, features) combination, strips, packages, uploads artifact
    - name: build-variant
      inputs:
        parameters:
          - name: triple
          - name: features
          - name: cross-image
          - name: strip-cmd
      activeDeadlineSeconds: 3600
      retryStrategy:
        limit: "1"
        retryPolicy: OnError
      container:
        image: "{{inputs.parameters.cross-image}}"
        command: [bash, -c]
        args:
          - |
            set -e

            TRIPLE="{{inputs.parameters.triple}}"
            FEATURES="{{inputs.parameters.features}}"
            VERSION="{{workflow.parameters.version}}"
            STRIP_CMD="{{inputs.parameters.strip-cmd}}"

            # Source build environment (SOURCE_DATE_EPOCH)
            if [ -f /workspace/build-env.sh ]; then
              . /workspace/build-env.sh
            else
              SOURCE_DATE_EPOCH=$(git show -s --format=%ct {{workflow.parameters.commit-sha}})
            fi
            export SOURCE_DATE_EPOCH

            echo "Building pdftract ${VERSION} for ${TRIPLE} (features: ${FEATURES})"
            echo "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}"

            cd /workspace

            # Install cross if not already present
            if ! command -v cross &> /dev/null; then
              cargo install cross --locked
            fi

            # Build with cross
            FEATURE_FLAG=""
            if [ "${FEATURES}" != "default" ]; then
              FEATURE_FLAG="--features ${FEATURES}"
            fi

            cross build --release --target ${TRIPLE} ${FEATURE_FLAG} --locked --frozen

            # Strip the binary
            BINARY_PATH="target/${TRIPLE}/release/pdftract"
            if [ "${TRIPLE}" = "x86_64-pc-windows-gnu" ]; then
              BINARY_PATH="target/${TRIPLE}/release/pdftract.exe"
            fi

            # For macOS targets, use osxcross strip from SDK
            if [[ "${TRIPLE}" == *-apple-darwin ]]; then
              # osxcross strip is mounted at /osxcross/bin
              STRIP_PATH="/osxcross/bin/${STRIP_CMD}"
              if [ -x "${STRIP_PATH}" ]; then
                "${STRIP_PATH}" "${BINARY_PATH}"
              else
                echo "Warning: osxcross strip not found at ${STRIP_PATH}, binary not stripped"
              fi
            else
              ${STRIP_CMD} "${BINARY_PATH}"
            fi

            # Prepare archive layout
            ARCHIVE_NAME="pdftract"
            if [ "${FEATURES}" != "default" ]; then
              ARCHIVE_NAME="pdftract-${FEATURES}"
            fi
            ARCHIVE_DIR="${ARCHIVE_NAME}-v${VERSION}-${TRIPLE}"
            mkdir -p "/artifacts/${ARCHIVE_DIR}"

            # Copy binary
            if [ "${TRIPLE}" = "x86_64-pc-windows-gnu" ]; then
              cp "${BINARY_PATH}" "/artifacts/${ARCHIVE_DIR}/pdftract.exe"
            else
              cp "${BINARY_PATH}" "/artifacts/${ARCHIVE_DIR}/pdftract"
            fi

            # Copy license files
            cp LICENSE-MIT /artifacts/${ARCHIVE_DIR}/
            cp LICENSE-APACHE /artifacts/${ARCHIVE_DIR}/
            cp README.md /artifacts/${ARCHIVE_DIR}/

            # Extract CHANGELOG excerpt for this version
            # Parse CHANGELOG.md for the section under "## [X.Y.Z]"
            if [ -f CHANGELOG.md ]; then
              python3 <<'EOF'
            import re
            version = "{{workflow.parameters.version}}".replace(".", r"\.")
            with open("CHANGELOG.md", "r") as f:
                content = f.read()
            # Find the section for this version
            pattern = rf"^## \[{version}\](?:.*?)(?=^## |\Z)"
            match = re.search(pattern, content, re.MULTILINE | re.DOTALL)
            if match:
                with open("/artifacts/{{inputs.parameters.triple}}-${{inputs.parameters.features}}/CHANGELOG.md", "w") as out:
                    out.write(f"## [{version}]\n")
                    out.write(match.group(0))
            else:
                # Fallback: write header only
                with open("/artifacts/{{inputs.parameters.triple}}-${{inputs.parameters.features}}/CHANGELOG.md", "w") as out:
                    out.write(f"## [{version}]\n\nSee https://github.com/{{workflow.parameters.repo}}/releases/tag/v{version}\n")
            EOF
            else
              echo "CHANGELOG.md not found, writing placeholder"
              echo "## [${VERSION}]\n\nSee https://github.com/{{workflow.parameters.repo}}/releases/tag/v${VERSION}" \
                > "/artifacts/${ARCHIVE_DIR}/CHANGELOG.md"
            fi

            # Create archive
            cd /artifacts
            if [ "${TRIPLE}" = "x86_64-pc-windows-gnu" ]; then
              ARCHIVE_FILE="${ARCHIVE_NAME}-v${VERSION}-${TRIPLE}.zip"
              zip -r "${ARCHIVE_FILE}" "${ARCHIVE_DIR}"
            else
              ARCHIVE_FILE="${ARCHIVE_NAME}-v${VERSION}-${TRIPLE}.tar.gz"
              tar czf "${ARCHIVE_FILE}" "${ARCHIVE_DIR}"
            fi

            echo "Built archive: ${ARCHIVE_FILE}"
            ls -lh "${ARCHIVE_FILE}"

            # Verify size budget for default x86_64-unknown-linux-musl
            if [ "${TRIPLE}" = "x86_64-unknown-linux-musl" ] && [ "${FEATURES}" = "default" ]; then
              SIZE_BYTES=$(stat -c%s "${BINARY_PATH}" 2>/dev/null || stat -f%z "${BINARY_PATH}")
              SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
              echo "Binary size: ${SIZE_MB} MB"
              if [ ${SIZE_MB} -gt 4 ]; then
                echo "WARNING: Binary exceeds 4 MB budget (${SIZE_MB} MB)"
              fi
            fi
        env:
          - name: CARGO_HOME
            value: /cache/cargo
          - name: CARGO_TARGET_DIR
            value: /workspace/target
        volumeMounts:
          - name: workspace
            mountPath: /workspace
          - name: cargo-cache
            mountPath: /cache/cargo
          - name: build-artifacts
            mountPath: /artifacts
          - name: osxcross-sdk
            mountPath: /osxcross
            readOnly: true
        resources:
          requests:
            cpu: 2000m
            memory: 4Gi
          limits:
            cpu: 4000m
            memory: 8Gi
      outputs:
        artifacts:
          - name: archive
            path: /artifacts/*.tar.gz
            optional: true
          - name: archive-zip
            path: /artifacts/*.zip
            optional: true

    # === Generate SLSA Provenance ===
    # Generates multiple.intoto.jsonl with SLSA Provenance v1.0 predicate
    # One statement covering all 10 binary archives as subjects
    #
    # Bead: pdftract-3gk5
    # Plan section: Release Engineering / Signing and Provenance, line 3402
    - name: generate-provenance
      activeDeadlineSeconds: 600
      container:
        image: python:3.11-slim-bookworm
        command: [python3, -c]
        args:
          - |
            import hashlib
            import json
            import os
            import subprocess
            from datetime import datetime, timezone

            TAG = "{{workflow.parameters.tag}}"
            VERSION = "{{workflow.parameters.version}}"
            COMMIT_SHA = "{{workflow.parameters.commit-sha}}"
            REPO = "{{workflow.parameters.repo}}"
            BUILD_TYPE = "https://argoproj.io/argo-workflows@v1"
            BUILDER_ID = "https://iad-ci-oidc.ardenone.com/argo-workflows/pdftract-release-cascade"

            # Artifact directory
            artifacts_dir = "/artifacts"

            # Generate SOURCE_DATE_EPOCH for reproducibility
            SOURCE_DATE_EPOCH = subprocess.check_output(
                ["git", "show", "-s", "--format=%ct", COMMIT_SHA],
                cwd="/workspace"
            ).decode().strip()

            # Collect all binary archives
            subjects = []
            for root, dirs, files in os.walk(artifacts_dir):
                for f in files:
                    if f.endswith((".tar.gz", ".zip")):
                        path = os.path.join(root, f)
                        # Compute SHA256
                        sha256 = hashlib.sha256()
                        with open(path, "rb") as fp:
                            for chunk in iter(lambda: fp.read(65536), b""):
                                sha256.update(chunk)
                        digest = sha256.hexdigest()
                        subjects.append({
                            "name": f,
                            "digest": {"sha256": digest}
                        })
                        print(f"Subject: {f} -> sha256:{digest}")

            # Compute Cargo.lock hash
            cargo_lock_path = "/workspace/Cargo.lock"
            cargo_lock_hash = None
            if os.path.exists(cargo_lock_path):
                sha256 = hashlib.sha256()
                with open(cargo_lock_path, "rb") as fp:
                    for chunk in iter(lambda: fp.read(65536), b""):
                        sha256.update(chunk)
                cargo_lock_hash = sha256.hexdigest()
                print(f"Cargo.lock: sha256:{cargo_lock_hash}")

            # Build resolved dependencies
            resolved_deps = [
                {
                    "uri": f"git+https://github.com/{REPO}@{COMMIT_SHA}",
                    "digest": {"gitCommit": COMMIT_SHA}
                }
            ]
            if cargo_lock_hash:
                resolved_deps.append({
                    "uri": "Cargo.lock",
                    "digest": {"sha256": cargo_lock_hash}
                })

            # Build invocation ID (reproducible from commit)
            invocation_id = f"argo-workflows-{COMMIT_SHA}-{TAG}"

            # Build timestamp from SOURCE_DATE_EPOCH
            started_on = datetime.fromtimestamp(int(SOURCE_DATE_EPOCH), tz=timezone.utc).isoformat()
            finished_on = datetime.now(timezone.utc).isoformat()

            # Construct SLSA Provenance v1.0 predicate
            provenance = {
                "_type": "https://in-toto.io/Statement/v1",
                "subject": subjects,
                "predicateType": "https://slsa.dev/provenance/v1.0",
                "predicate": {
                    "buildDefinition": {
                        "buildType": BUILD_TYPE,
                        "externalParameters": {
                            "tag": TAG,
                            "version": VERSION,
                            "commit": COMMIT_SHA,
                            "source": f"https://github.com/{REPO}"
                        },
                        "internalParameters": {
                            "workflow": "pdftract-build-binaries",
                            "targetTriples": [
                                "x86_64-unknown-linux-musl",
                                "aarch64-unknown-linux-musl",
                                "x86_64-apple-darwin",
                                "aarch64-apple-darwin",
                                "x86_64-pc-windows-gnu"
                            ]
                        },
                        "resolvedDependencies": resolved_deps
                    },
                    "runDetails": {
                        "builder": {
                            "id": BUILDER_ID,
                            "builderDependencies": [],
                            "version": {
                                "argo": "v3.5.x"
                            }
                        },
                        "metadata": {
                            "invocationId": invocation_id,
                            "startedOn": started_on,
                            "finishedOn": finished_on
                        },
                        "byproducts": []
                    }
                }
            }

            # Write to multiple.intoto.jsonl (one JSON per line)
            output_path = "/provenance/multiple.intoto.jsonl"
            os.makedirs(os.path.dirname(output_path), exist_ok=True)
            with open(output_path, "w") as f:
                f.write(json.dumps(provenance) + "\n")

            print(f"Provenance written to {output_path}")
            print(f"Subjects: {len(subjects)}")
            print(f"Invocation ID: {invocation_id}")
        volumeMounts:
          - name: build-artifacts
            mountPath: /artifacts
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
      outputs:
        artifacts:
          - name: provenance
            path: /provenance/multiple.intoto.jsonl

    # === Collect Provenance Output ===
    # Helper template to aggregate provenance from generate-provenance
    # This ensures the provenance file is available as a workflow-level output
    - name: collect-provenance-output
      activeDeadlineSeconds: 60
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            set -e
            echo "=== Collecting provenance artifacts ==="
            # Ensure output directory exists
            mkdir -p /output/provenance
            # Copy provenance if exists
            if [ -f /provenance/multiple.intoto.jsonl ]; then
              cp /provenance/multiple.intoto.jsonl /output/provenance/
              echo "Provenance collected: multiple.intoto.jsonl"
              ls -lh /output/provenance/
            else
              echo "Warning: provenance file not found"
            fi
        volumeMounts:
          - name: build-artifacts
            mountPath: /artifacts
          - name: workspace
            mountPath: /workspace
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      outputs:
        artifacts:
          - name: provenance-output
            path: /output/provenance/multiple.intoto.jsonl
            optional: true
