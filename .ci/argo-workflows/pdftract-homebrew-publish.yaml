# pdftract-homebrew-publish WorkflowTemplate
#
# Homebrew distribution channel. Pipeline:
#
#   versioned-tag-gate -> verify-release-metadata -> render-formula
#                      -> push-tap -> wait-for-mirror -> brew-verify
#
# - versioned-tag-gate publishes only for immutable, non-prerelease
#   versioned tags vX.Y.Z; everything else SKIPS as a Succeeded no-op.
# - verify-release-metadata consumes the release's published SHA256SUMS
#   aggregate -- downloaded as published with its cosign signature and
#   certificate, verified against the iad-ci OIDC identity before any
#   formula work is accepted. It extracts the signed checksum handoff for
#   the canonical source archive; the render leg never downloads or
#   re-hashes that archive.
# - render-formula resolves the release tuple and renders
#   Formula/pdftract.rb through packaging/homebrew/render_formula.py --
#   the deterministic renderer authored by pdftract-fb684d69 -- taken
#   from the release tag's own tree, next to its
#   packaging/homebrew/pdftract.rb.template sibling
#   (pdftract-2ba6e643). The renderer owns every structural check:
#   canonical release-tuple URLs, prerelease/floating-ref rejection,
#   placeholder completeness, exactly-one url/version/sha256 binding,
#   forbidden refs, bare-SHA detection, and `ruby -c` on both the
#   template and the rendered formula. The formula's sha256 is the signed
#   checksum handoff for the exact bytes the formula url serves (the tag's
#   source archive, hashed once by the release producer) -- never a value
#   recomputed or copied from a floating artifact.
# - push-tap commits the rendered formula to the Forgejo tap
#   (git.ardenone.com/jedarden/homebrew-tap, source of truth) and
#   pushes ONLY to that origin; GitHub hosts the read-only push mirror
#   that Homebrew clients actually fetch.
# - wait-for-mirror bounded-polls the GitHub mirror for the pushed
#   commit; brew-verify install-verifies through the client-facing
#   path: `brew tap jedarden/tap` against the GitHub mirror,
#   `brew install jedarden/tap/pdftract`, `pdftract --version`
#   reporting the released version.
#
# Runs as a step of the release cascade (pdftract-release-cascade)
# strictly after pdftract-github-release has published the release
# (tag push precedes the release; the tag's source archive and the
# signed SHA256SUMS only resolve afterwards), and can be invoked
# standalone for a repaired/re-run channel:
#
#   argo submit --from workflowtemplate/pdftract-homebrew-publish \
#     -p tag=vX.Y.Z -p version=X.Y.Z
#
# A dry run proves the render+validation path end to end with a stub
# archive and stops before any push:
#
#   argo submit --from workflowtemplate/pdftract-homebrew-publish \
#     -p tag=v9.9.9 -p version=9.9.9 -p dry_run=true
#
# In a dry run the verify-release-metadata step logs an explicit SKIP
# (a fake tag has no release to verify -- it never claims "verified"),
# render-formula still runs the real renderer from the repo's default
# branch against a deterministic checksum fixture, and push-tap/wait-for-mirror/brew-verify
# are omitted entirely -- so the push credential is never even mounted
# and nothing reaches any tap.
#
# === Failure and retry behavior ===
#
# No step in this leg ever reports success for work it did not do:
#
# - Step level: verify-release-metadata and render-formula carry an
#   Argo retryStrategy (limit 2 / 1, exponential backoff) because their
#   failures are dominated by transient network fetches; every fetch
#   additionally uses `curl --retry 3`. A retry re-runs the step from
#   scratch, which is safe: rendering is deterministic, and nothing has
#   been published yet.
# - push-tap retries once: it is idempotent by construction -- it
#   re-clones, re-writes the formula, and pushes nothing when the
#   rendered formula is unchanged ("Formula unchanged ... idempotent
#   re-run"), so a retry after a failed push cannot double-publish.
# - wait-for-mirror is itself a bounded poll (10s interval, 5 min
#   ceiling); on timeout it FAILS with a mirror-lag message naming the
#   missing commit, not a generic error.
# - brew-verify retries once (brew downloads are network-flaky); it
#   FAILS unless `pdftract --version` prints the released version.
# - Hard verification failures (missing/invalid SHA256SUMS assets,
#   cosign rejection, renderer rejection, push rejection) exit nonzero
#   and are never retried past the limits above -- they fail the leg
#   loudly.
# - Workflow level: activeDeadlineSeconds (16200s) is a backstop over
#   the worst-case serial sum of per-step deadlines x attempts
#   (60 + 3x420 + 2x600 + 2x300 + 420 + 2x5400 = 14340s, ~13%
#   headroom) so a wedged pod can never hang the run forever.
# - Cascade level: the cascade invokes this leg with
#   `continueOn: failed` -- a tap failure must not fail an
#   already-published release -- but the leg's own workflow status is
#   Failed and visible. A standalone run has no such shield: the tap
#   is that run's deliverable and failures are fatal.
# - Re-runs for the same tag are safe (idempotent no-op push). A
#   botched release is re-cut under a NEW tag (org no-force-push rule);
#   tags are never rewritten.
#
# === Version policy (strategy §6) ===
#
# The leg gates on immutable, non-prerelease versioned tags vX.Y.Z
# only. Anything else -- rc/prerelease tags, `:latest`-style aliases,
# branch names, bare git SHAs, empty -- is SKIPPED by the gate as a
# Succeeded no-op, and the render step re-checks the same policy as
# defense in depth (no code path can render past policy). Every
# container image this template runs is pinned to a semver tag;
# `:latest` is rejected org-wide.
#
# === Hosting (strategy §4) ===
#
# The tap's source of truth is Forgejo; GitHub hosts the read-only
# Forgejo push mirror that Homebrew clients actually fetch. CI writes
# ONLY to the Forgejo origin.
#
# === Credential (strategy §8.3, as corrected 2026-09-15) ===
#
# The tap push token travels by reference end to end:
# secret/rs-manager/iad-ci/forgejo/homebrew-tap-push-token on the
# rs-manager OpenBao instance (the one iad-ci's ClusterSecretStore
# "openbao" serves) -> ExternalSecret homebrew-tap-push-token
# (declarative-config k8s/iad-ci/argo-workflows/
# homebrew-tap-push-token-externalsecret.yml, enabled 2026-09-15 by
# pdftract-54cad4cb; verified SecretSynced=True 2026-09-26) -> the
# homebrew-tap-push-token k8s Secret this template's push-tap step
# injects as an env var and hands to git through a credential helper.
# No token value appears in this manifest, in any argv, in any
# parameter, or in any log line; the value's correctness is verified
# only by its downstream effect (git push succeeds, the mirror
# reflects the commit). Only push-tap mounts the Secret, and in a dry
# run that step is omitted, so the credential is never mounted at all.
#
# === Formula shape (strategy §5) ===
#
# Build-from-source against the versioned-tag source archive with
# depends_on "rust" -- no bottles in the first iteration. The rendered
# formula is generated content; hand fixes go to
# packaging/homebrew/pdftract.rb.template in jedarden/pdftract, never
# to the tap.
#
# Bead: pdftract-93b464bb (rework of the pdftract-da3c85cd leg onto the
#       pdftract-966cd3fd / pdftract-fb684d69 contract)
# Contract: docs/notes/homebrew-tap-strategy.md (§4 hosting, §5 formula
#           + handoff tuple, §6 version policy, §7 cascade placement,
#           §8 prerequisites); packaging/homebrew/README.md
# Plan section: Release Engineering / Argo WorkflowTemplates, line 3393
#
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pdftract-homebrew-publish
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: pdftract-homebrew-publish
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: pdftract
spec:
  entrypoint: homebrew-pipeline
  serviceAccountName: argo-workflow

  # Backstop: see "Failure and retry behavior" above for the math.
  # Per-step activeDeadlineSeconds does not cover a pod that hangs
  # before it starts; without a workflow-level cap such a run is never
  # terminated.
  activeDeadlineSeconds: 16200

  # Object form + ttlStrategy: the string podGC and the Job-style
  # ttlSecondsAfterFinished keys are not valid against this cluster's
  # Argo CRD -- the string podGC failed the WorkflowTemplate apply
  # outright ("spec.podGC in body must be of type object",
  # argo-workflows-ns-iad-ci sync Failed 2026-09-15), and
  # ttlSecondsAfterFinished is not an Argo field at all (silently
  # pruned; the TTL never applied). Same shape as the SDK publish
  # siblings in this directory.
  podGC:
    strategy: OnPodCompletion

  ttlStrategy:
    secondsAfterSuccess: 1800
    secondsAfterFailure: 7200

  arguments:
    parameters:
      - name: repo
        value: jedarden/pdftract
        description: "Source mirror slug on GitHub; the release tuple, template, and renderer are fetched from it anonymously"
      - name: tag
        value: ""
        description: "Versioned git tag (vX.Y.Z). Anything else is skipped by the gate."
      - name: version
        value: ""
        description: "Version from the tag, no leading v (X.Y.Z)"
      - name: dry_run
        value: "false"
        description: "'true' renders against a deterministic checksum fixture and stops before any push -- no credential needed"
      - name: brew-image
        value: homebrew/brew:4.6.20
        description: "Pinned Homebrew image (semver tag, never a floating ref) used for install verification"
      - name: sums-identity-regexp
        value: "https://iad-ci-oidc.ardenone.com.*"
        description: "Certificate identity regexp the SHA256SUMS signing certificate must match -- must equal pdftract-github-release's COSIGN_CERTIFICATE_IDENTITY"
      - name: sums-oidc-issuer
        value: "https://iad-ci-oidc.ardenone.com"
        description: "OIDC issuer the SHA256SUMS signing certificate must name -- must equal pdftract-github-release's COSIGN_OIDC_ISSUER"

  templates:
    # === Top-level DAG ===
    # gate -> verify-release-metadata -> render -> push -> wait-for-mirror
    # -> brew-verify. Every step after the gate is omitted for
    # non-versioned tags (proceed=false), and push/verify are
    # additionally omitted in dry_run, so a dry run or a non-versioned
    # ref completes Succeeded with nothing published.
    - name: homebrew-pipeline
      dag:
        tasks:
          - name: versioned-tag-gate
            template: versioned-tag-gate

          - name: verify-release-metadata
            template: verify-release-metadata
            dependencies: [versioned-tag-gate]
            when: "{{tasks.versioned-tag-gate.outputs.parameters.proceed}} == true"

          - name: render-formula
            template: render-formula
            dependencies: [versioned-tag-gate, verify-release-metadata]
            when: "{{tasks.versioned-tag-gate.outputs.parameters.proceed}} == true"
            arguments:
              parameters:
                - name: source-archive-sha256
                  value: "{{tasks.verify-release-metadata.outputs.parameters.source-archive-sha256}}"

          - name: push-tap
            template: push-tap
            dependencies: [versioned-tag-gate, verify-release-metadata, render-formula]
            when: "{{tasks.versioned-tag-gate.outputs.parameters.proceed}} == true && {{workflow.parameters.dry_run}} != true"
            arguments:
              parameters:
                - name: formula-b64
                  value: "{{tasks.render-formula.outputs.parameters.formula-b64}}"

          - name: wait-for-mirror
            template: wait-for-mirror
            dependencies: [versioned-tag-gate, push-tap]
            when: "{{tasks.versioned-tag-gate.outputs.parameters.proceed}} == true && {{workflow.parameters.dry_run}} != true"
            arguments:
              parameters:
                - name: tap-commit
                  value: "{{tasks.push-tap.outputs.parameters.tap-commit}}"

          - name: brew-verify
            template: brew-verify
            dependencies: [versioned-tag-gate, wait-for-mirror]
            when: "{{tasks.versioned-tag-gate.outputs.parameters.proceed}} == true && {{workflow.parameters.dry_run}} != true"

    # === Versioned-Tag Gate ===
    # Publishes to the tap only for immutable, non-prerelease versioned tags
    # vX.Y.Z (strategy §6). Anything else -- rc tags, `:latest`-style aliases,
    # branch names, bare SHAs, empty -- SKIPS the leg (proceed=false): a
    # skipped leg is a Succeeded workflow with every downstream step omitted,
    # never a failed release.
    - name: versioned-tag-gate
      activeDeadlineSeconds: 60
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            set -eu
            TAG="{{workflow.parameters.tag}}"
            if [ -z "${TAG}" ]; then
              echo "Gate SKIP: no tag parameter -- the tap leg publishes versioned vX.Y.Z tags only"
              echo false > /tmp/proceed
              exit 0
            fi
            if printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Gate PASS: ${TAG} is a non-prerelease versioned tag"
              echo true > /tmp/proceed
            else
              echo "Gate SKIP: '${TAG}' is not a vX.Y.Z versioned tag."
              echo "  rc/prerelease tags, :latest-style aliases, branch names and bare"
              echo "  git SHAs are never published to the tap"
              echo "  (docs/notes/homebrew-tap-strategy.md §6)."
              echo false > /tmp/proceed
            fi
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      outputs:
        parameters:
          - name: proceed
            valueFrom:
              path: /tmp/proceed

    # === Verify Release Metadata ===
    # Strategy §5 handoff: the leg consumes the release's published
    # SHA256SUMS as-is, together with its cosign signature
    # (SHA256SUMS.sig) and signing certificate (SHA256SUMS.pem), and
    # verifies them BEFORE accepting the release metadata. The release
    # producer includes the canonical source archive's checksum in the
    # signed aggregate. A release missing any of the three assets, the
    # source-archive checksum line, or whose verification fails,
    # stops formula generation here (fail closed) -- the tap is never
    # updated from an unverified release.
    #
    # The aggregate is never rewritten or appended to by this leg. The
    # release producer hashes the exact canonical tag archive once while
    # assembling the signed aggregate, and this leg consumes that signed
    # source-archive line as the formula's sha256 handoff.
    #
    # One alpine container fetches the three assets, sanity-checks them,
    # and verifies the signature with cosign from alpine 3.19's frozen
    # community repo (2.2.1-r3; the signing leg runs the cosign 2.2.3
    # image -- verify-blob semantics for this flag set are identical
    # across 2.2.x, and the apk pin is as immutable as the alpine release
    # it ships from. If exact signer parity is ever required, switch to
    # the digest-pinned upstream binary
    # f669f41176cb1d58bb6a3fdb06e24861540cfdb5a571b4ec5eb2218b0df5d304).
    # The verification enforces the iad-ci OIDC identity constraints --
    # the same identity/issuer pdftract-github-release signs with.
    # --insecure-ignore-tlog skips only the rekor inclusion check so the
    # verdict is deterministic from inside the cluster; the signature,
    # the Fulcio certificate chain, and the iad-ci OIDC identity are
    # still fully verified (cosign warns about the skipped tlog check,
    # which is the documented trade-off).
    #
    # In a dry run there is no real release to verify: the step logs an
    # explicit SKIP, creates a deterministic local source archive, and
    # extracts its digest from a matching local SHA256SUMS fixture. This
    # exercises the same archive-to-checksum handoff without downloading a
    # release or claiming that a fake tag was verified. It never logs
    # "verified" for a dry run.
    #
    # Retry: limit 2 (3 attempts) -- failures here are dominated by
    # transient release-asset fetches; nothing has been published yet,
    # so re-running the whole fetch+verify from scratch is safe.
    - name: verify-release-metadata
      activeDeadlineSeconds: 420
      retryStrategy:
        limit: "2"
        retryPolicy: OnFailure
        backoff:
          duration: "10s"
          factor: "2"
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            set -eu
            apk add --no-cache curl cosign

            REPO="{{workflow.parameters.repo}}"
            TAG="{{workflow.parameters.tag}}"
            DRY_RUN="{{workflow.parameters.dry_run}}"
            IDENTITY_REGEXP="{{workflow.parameters.sums-identity-regexp}}"
            OIDC_ISSUER="{{workflow.parameters.sums-oidc-issuer}}"
            BASE="https://github.com/${REPO}/releases/download/${TAG}"
            SOURCE_ARCHIVE_NAME="source/pdftract-v${TAG#v}.tar.gz"
            cd /tmp

            if [ "${DRY_RUN}" = "true" ]; then
              echo "=== DRY RUN: release-metadata verification SKIPPED -- tag ${TAG} is a stub with no release to verify ==="
              echo "=== DRY RUN: building local source archive + SHA256SUMS handoff fixture ==="
              mkdir -p "$(dirname "${SOURCE_ARCHIVE_NAME}")"
              printf '%s\n' "pdftract Homebrew render fixture" > "${SOURCE_ARCHIVE_NAME}"
              sha256sum "${SOURCE_ARCHIVE_NAME}" > SHA256SUMS
              sha256sum -c SHA256SUMS
              SOURCE_ARCHIVE_SHA256="$(awk -v expected="${SOURCE_ARCHIVE_NAME}" '$2 == expected { print $1; found += 1 } END { if (found != 1) exit 1 }' SHA256SUMS)" \
                || { echo "ERROR: dry-run SHA256SUMS fixture has no unique source archive checksum" >&2; exit 1; }
              printf '%s' "${SOURCE_ARCHIVE_SHA256}" | grep -Eq '^[0-9a-f]{64}$' \
                || { echo "ERROR: dry-run source archive checksum fixture is not lowercase SHA-256" >&2; exit 1; }
              printf '%s' "${SOURCE_ARCHIVE_SHA256}" > /tmp/source-archive-sha256
              echo "=== DRY RUN: matching local archive/checksum handoff accepted ==="
              exit 0
            fi

            echo "=== Fetching release integrity metadata for ${TAG} ==="
            for asset in SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem; do
              curl -fsSL --retry 3 "${BASE}/${asset}" -o "${asset}" \
                || { echo "ERROR: release ${TAG} is missing its ${asset} asset -- refusing to publish (strategy §5 handoff)" >&2; exit 1; }
            done

            # Structural sanity before crypto verification: the
            # aggregate must be a non-empty list of checksum lines.
            [ -s SHA256SUMS ] \
              || { echo "ERROR: SHA256SUMS for ${TAG} is empty" >&2; exit 1; }
            grep -Eq '^[0-9a-f]{64}  ' SHA256SUMS \
              || { echo "ERROR: SHA256SUMS for ${TAG} contains no checksum lines" >&2; exit 1; }
            [ -s SHA256SUMS.sig ] && [ -s SHA256SUMS.pem ] \
              || { echo "ERROR: signature or certificate asset for ${TAG} is empty" >&2; exit 1; }

            echo "=== Verifying SHA256SUMS for ${TAG} with $(cosign version 2>/dev/null | head -1) ==="
            echo "    identity: ${IDENTITY_REGEXP} / issuer: ${OIDC_ISSUER}"
            echo "    (tlog inclusion check skipped for an in-cluster-deterministic verdict; cosign warns -- expected)"
            cosign verify-blob \
              --certificate-identity-regexp "${IDENTITY_REGEXP}" \
              --certificate-oidc-issuer "${OIDC_ISSUER}" \
              --insecure-ignore-tlog \
              --signature SHA256SUMS.sig \
              --certificate SHA256SUMS.pem \
              SHA256SUMS \
              || { echo "ERROR: SHA256SUMS for ${TAG} failed signature/identity verification -- refusing to publish (strategy §5 handoff)" >&2; exit 1; }

            SOURCE_ARCHIVE_SHA256="$(awk -v expected="${SOURCE_ARCHIVE_NAME}" '$2 == expected { print $1; found += 1 } END { if (found != 1) exit 1 }' SHA256SUMS)" \
              || { echo "ERROR: signed SHA256SUMS has no unique checksum for ${SOURCE_ARCHIVE_NAME}" >&2; exit 1; }
            printf '%s' "${SOURCE_ARCHIVE_SHA256}" | grep -Eq '^[0-9a-f]{64}$' \
              || { echo "ERROR: source archive checksum handoff is not lowercase SHA-256" >&2; exit 1; }
            printf '%s' "${SOURCE_ARCHIVE_SHA256}" > /tmp/source-archive-sha256
            echo "=== Source archive checksum handoff accepted for ${SOURCE_ARCHIVE_NAME} ==="
            echo "=== Release metadata VERIFIED: signed SHA256SUMS accepted for ${TAG} ($(wc -l < SHA256SUMS) checksum lines) ==="
        outputs:
          parameters:
            - name: source-archive-sha256
              valueFrom:
                path: /tmp/source-archive-sha256
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

    # === Render Formula ===
    # Resolves the release tuple and renders the formula through
    # packaging/homebrew/render_formula.py -- the deterministic
    # renderer (pdftract-fb684d69) -- taken from the release tag's own
    # tree so the renderer, the template
    # (packaging/homebrew/pdftract.rb.template, pdftract-2ba6e643), and
    # the release are version-coherent. A tag cut before the renderer
    # landed fails closed here.
    #
    # Inputs to the renderer (packaging/homebrew/README.md contract):
    # the seven-field immutable release tuple. The source-archive digest
    # comes from the signed SHA256SUMS handoff produced upstream -- the
    # formula's sha256 always describes what brew will download, never a
    # recomputed or floating artifact.
    # The SHA256SUMS_* URLs are the canonical release URLs; the
    # renderer re-validates every field's canonical form.
    #
    # The renderer performs ALL structural validation (placeholders,
    # url/version/sha256 binding, floating-ref and bare-SHA rejection,
    # ruby -c on template and output) and exits nonzero on any
    # violation -- a formula that fails validation never reaches the
    # push step. That validation is the dry-run "prove before push"
    # path: in dry_run the same renderer runs against a deterministic
    # checksum fixture with the real template from the default branch.
    #
    # The rendered formula is handed to push-tap as a base64 parameter,
    # not an artifact: iad-ci has no artifact repository, and an
    # outputs.artifacts node fails there with exit 64. The formula is
    # ~2 KB, comfortably inside a workflow-status parameter.
    #
    # Retry: limit 1 (2 attempts) -- transient clone/download failures
    # only; rendering is deterministic and nothing is published yet.
    - name: render-formula
      inputs:
        parameters:
          - name: source-archive-sha256
      activeDeadlineSeconds: 600
      retryStrategy:
        limit: "1"
        retryPolicy: OnFailure
        backoff:
          duration: "10s"
          factor: "2"
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            set -eu
            apk add --no-cache python3 git ruby

            REPO="{{workflow.parameters.repo}}"
            TAG="{{workflow.parameters.tag}}"
            VERSION="{{workflow.parameters.version}}"
            DRY_RUN="{{workflow.parameters.dry_run}}"

            # Defense in depth: the DAG gate already skipped
            # non-versioned tags; re-check so no code path can render
            # past policy (the renderer re-checks the tuple too).
            printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              || { echo "ERROR: refusing to render for non-versioned tag '${TAG}'" >&2; exit 1; }
            [ "v${VERSION}" = "${TAG}" ] \
              || { echo "ERROR: version '${VERSION}' does not match tag '${TAG}'" >&2; exit 1; }

            # Canonical release-tuple URLs (strategy §5 handoff table);
            # render_formula.py rejects any other form.
            ARCHIVE_URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
            SUMS_URL="https://github.com/${REPO}/releases/download/${TAG}/SHA256SUMS"
            SOURCE_ARCHIVE_SHA256="{{inputs.parameters.source-archive-sha256}}"
            printf '%s' "${SOURCE_ARCHIVE_SHA256}" | grep -Eq '^[0-9a-f]{64}$' \
              || { echo "ERROR: refusing to render without the signed source-archive checksum handoff" >&2; exit 1; }
            echo "=== Consuming signed source archive checksum handoff for ${TAG} ==="

            # The renderer and template ship in the tag's own tree (the
            # tag carries the formula contract it was released with) --
            # but a dry run's tag is deliberately fake (v9.9.9 et al.),
            # so no such ref exists to clone. A dry run therefore takes
            # them from the repo's default branch: what is under test
            # is the render+validate path, not the tag's tree.
            TEMPLATE_REF="${TAG}"
            if [ "${DRY_RUN}" = "true" ]; then
              TEMPLATE_REF="main"
              echo "=== DRY RUN: renderer + template from default branch 'main' (stub tag ${TAG} has no ref to clone) ==="
            fi
            echo "=== Cloning ${REPO} at ${TEMPLATE_REF} for packaging/homebrew ==="
            git clone --quiet --depth 1 --branch "${TEMPLATE_REF}" "https://github.com/${REPO}.git" /src

            cd /src/packaging/homebrew
            [ -f render_formula.py ] \
              || { echo "ERROR: packaging/homebrew/render_formula.py is not present at ${TEMPLATE_REF} (tag predates the renderer contract, pdftract-fb684d69)" >&2; exit 1; }
            [ -f pdftract.rb.template ] \
              || { echo "ERROR: packaging/homebrew/pdftract.rb.template is not present at ${TEMPLATE_REF}" >&2; exit 1; }

            cat > /tmp/release-inputs.json <<JSON
            {
              "RELEASE_TAG": "${TAG}",
              "VERSION": "${VERSION}",
              "SOURCE_ARCHIVE_URL": "${ARCHIVE_URL}",
              "SOURCE_ARCHIVE_SHA256": "${SOURCE_ARCHIVE_SHA256}",
              "SHA256SUMS_URL": "${SUMS_URL}",
              "SHA256SUMS_SIG_URL": "${SUMS_URL}.sig",
              "SHA256SUMS_PEM_URL": "${SUMS_URL}.pem"
            }
            JSON
            echo "=== Release tuple (no secrets; hashes and canonical URLs only) ==="
            cat /tmp/release-inputs.json

            echo "=== Rendering via render_formula.py (its validators + ruby -c are the gate) ==="
            python3 render_formula.py \
              --inputs /tmp/release-inputs.json \
              --output /tmp/Formula/pdftract.rb

            echo "=== Rendered Formula/pdftract.rb for ${TAG} (dry_run=${DRY_RUN}) ==="
            cat /tmp/Formula/pdftract.rb

            base64 /tmp/Formula/pdftract.rb | tr -d '\n' > /tmp/formula.b64
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      outputs:
        parameters:
          - name: formula-b64
            valueFrom:
              path: /tmp/formula.b64

    # === Push to Tap ===
    # Commits the rendered formula to the Forgejo tap repo (source of
    # truth) with the org git identity and pushes to main. Idempotent:
    # re-runs with an unchanged formula push nothing (the mirror wait
    # then also no-ops), so a retry after a failed push cannot
    # double-publish.
    #
    # The push token is injected as an env var from the
    # homebrew-tap-push-token Secret (ExternalSecret-synced from OpenBao,
    # see the header) and passed to git through a credential helper, so
    # it never appears in a URL, in argv, or in output. The helper also
    # authenticates the clone itself, which keeps the step working
    # under the Forgejo instance's sign-in-required policy. The value's
    # correctness is verified only by downstream effect.
    #
    # Retry: limit 1 (2 attempts) -- safe because the step is a
    # clone-write-diff-commit-push sequence that no-ops on an unchanged
    # formula.
    - name: push-tap
      inputs:
        parameters:
          - name: formula-b64
      activeDeadlineSeconds: 300
      retryStrategy:
        limit: "1"
        retryPolicy: OnFailure
        backoff:
          duration: "10s"
          factor: "2"
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            set -eu
            apk add --no-cache git

            VERSION="{{workflow.parameters.version}}"
            # Keep the write destination fixed: this workflow may publish only
            # to the approved Forgejo tap source of truth.
            TAP_URL="https://git.ardenone.com/jedarden/homebrew-tap.git"
            FORMULA_B64="{{inputs.parameters.formula-b64}}"

            git clone --quiet "${TAP_URL}" /tap
            mkdir -p /tap/Formula
            printf '%s' "${FORMULA_B64}" | base64 -d > /tap/Formula/pdftract.rb

            cd /tap
            git config user.name jedarden
            git config user.email github@jedarden.com

            # Stage exactly the generated formula. This guard protects the
            # destination if the tap gains other generated or user files.
            git add -- Formula/pdftract.rb
            STAGED_PATHS="$(git diff --cached --name-only)"
            if [ -n "${STAGED_PATHS}" ] && [ "${STAGED_PATHS}" != "Formula/pdftract.rb" ]; then
              echo "ERROR: refusing to publish paths other than Formula/pdftract.rb" >&2
              exit 1
            fi
            if git diff --cached --quiet; then
              echo "Formula unchanged since the last push -- nothing to commit (idempotent re-run)"
              echo UNCHANGED > /tmp/tap-commit
              exit 0
            fi

            git commit --quiet -m "pdftract v${VERSION}" \
              -m "Formula rendered by packaging/homebrew/render_formula.py (jedarden/pdftract) in the pdftract-homebrew-publish leg of the release cascade. Generated file -- do not edit by hand."
            git push --quiet origin main
            COMMIT="$(git rev-parse HEAD)"
            echo "=== Pushed ${COMMIT} to the Forgejo tap (main) ==="
            echo "${COMMIT}" > /tmp/tap-commit
        env:
          - name: GIT_CONFIG_COUNT
            value: "1"
          - name: GIT_CONFIG_KEY_0
            value: credential.helper
          - name: GIT_CONFIG_VALUE_0
            value: '!f() { test "$1" = get && echo "username=jedarden" && echo "password=$TAP_TOKEN"; }; f'
          - name: TAP_TOKEN
            valueFrom:
              secretKeyRef:
                name: homebrew-tap-push-token
                key: token
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      outputs:
        parameters:
          - name: tap-commit
            valueFrom:
              path: /tmp/tap-commit

    # === Wait for Mirror ===
    # CI pushes to the Forgejo origin; Homebrew clients fetch the GitHub push
    # mirror. Bounded-poll the mirror (strategy §8.6) until it reflects the
    # commit we just pushed -- on timeout, fail with a mirror-lag message,
    # not a generic failure. sync_on_commit makes this seconds in the normal
    # case; 5 minutes is the ceiling.
    - name: wait-for-mirror
      inputs:
        parameters:
          - name: tap-commit
      activeDeadlineSeconds: 420
      container:
        image: alpine:3.19
        command: [sh, -c]
        args:
          - |
            set -eu
            apk add --no-cache git

            COMMIT="{{inputs.parameters.tap-commit}}"

            if [ "${COMMIT}" = "UNCHANGED" ]; then
              echo "Formula already on the tap -- nothing new to wait for"
              exit 0
            fi

            TAP_REPO="jedarden/homebrew-tap"
            MIRROR="https://github.com/jedarden/homebrew-tap.git"
            echo "=== Polling ${MIRROR} (main) for ${COMMIT} ==="
            i=0
            until git ls-remote --quiet "${MIRROR}" refs/heads/main | grep -q "^${COMMIT}"; do
              i=$((i + 1))
              if [ "${i}" -gt 30 ]; then
                echo "ERROR: GitHub mirror did not reflect tap commit ${COMMIT} within 5 minutes" >&2
                echo "  (Forgejo->GitHub push-mirror lag; check the mirror config on" >&2
                echo "  git.ardenone.com/jedarden/${TAP_REPO} before re-running)" >&2
                exit 1
              fi
              sleep 10
            done
            echo "=== Mirror reflects ${COMMIT} after ~$((i * 10))s ==="
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

    # === Brew Install Verification ===
    # Post-release verification through the client-facing path users take
    # (strategy §7): from a clean pinned Homebrew container, tap the GitHub
    # mirror, install the formula, and require `pdftract --version` to run
    # and report the released version. The tap and the source archive are
    # public, so no credential is needed here. The formula builds from
    # source (depends_on "rust"), so brew pulls the rust toolchain first --
    # hence the generous deadline and memory.
    #
    # Retry: limit 1 (2 attempts) -- brew downloads are network-flaky;
    # a retry re-installs into a fresh container and cannot double-publish.
    - name: brew-verify
      activeDeadlineSeconds: 5400
      retryStrategy:
        limit: "1"
        retryPolicy: OnFailure
        backoff:
          duration: "30s"
          factor: "2"
      container:
        image: "{{workflow.parameters.brew-image}}"
        command: [bash, -c]
        args:
          - |
            set -euo pipefail

            TAP_REPO="jedarden/homebrew-tap"
            VERSION="{{workflow.parameters.version}}"

            echo "=== brew verify: tapping jedarden/tap from github.com/${TAP_REPO} ==="
            brew tap jedarden/tap "https://github.com/${TAP_REPO}.git"

            echo "=== brew install jedarden/tap/pdftract ==="
            brew install jedarden/tap/pdftract

            echo "=== pdftract --version ==="
            INSTALLED_VERSION="$(pdftract --version)"
            echo "${INSTALLED_VERSION}"
            echo "${INSTALLED_VERSION}" | grep -q "${VERSION}" \
              || { echo "ERROR: installed pdftract does not report ${VERSION}" >&2; exit 1; }

            echo "=== brew verify PASS: pdftract ${VERSION} installed and runs ==="
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            # iad-ci's largest compute1-8 node exposes 3500m CPU / 6.16GiB;
            # higher limits can never schedule and are rejected by the
            # cluster's manifest guardrail.
            cpu: 3500m
            memory: 6Gi
