# pdftract-nightly-supply-chain CronWorkflow
#
# Nightly dependency-policy scan for the Forgejo source of truth. The scan is
# intentionally independent of push CI: it refreshes RustSec and cargo-deny
# policy data daily so newly published advisories are visible even when the
# repository is quiet.
#
# Logs are retained in completed pods for 24 hours because iad-ci has no Argo
# artifact repository. Workflow status is retained longer by ttlStrategy, so
# the terminal phase and node exit codes remain queryable after pod cleanup.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: pdftract-nightly-supply-chain
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: pdftract-nightly-supply-chain
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: pdftract
spec:
  schedules:
    - "0 3 * * *" # Daily at 03:00 UTC.
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: argo-workflow

    # Setup (300s) + audit (1800s) + deny (1800s), with scheduling and image
    # pull headroom. This also bounds a run whose PVC never becomes usable.
    activeDeadlineSeconds: 5400

    # iad-ci does not expose an artifact repository. Keep pods until the
    # workflow is terminal, then delay pod GC so kubectl logs remains available
    # for one day. PVCs are deleted at workflow completion and are independently
    # bounded below; workflow status survives for 3 days (success) or 7 days
    # (failure) for terminal-phase and exit-code evidence.
    podGC:
      strategy: OnWorkflowCompletion
      deleteDelayDuration: 24h
    ttlStrategy:
      secondsAfterSuccess: 259200
      secondsAfterFailure: 604800
    volumeClaimGC:
      strategy: OnWorkflowCompletion

    # The audit and deny tasks are deliberately sequential because the shared
    # workspace and cargo cache use RWO PVCs.
    parallelism: 1
    volumeClaimTemplates:
      - metadata:
          name: workspace
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: sata
          resources:
            requests:
              storage: 5Gi
      - metadata:
          name: cargo-cache
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: sata
          resources:
            requests:
              storage: 20Gi

    podMetadata:
      labels:
        app.kubernetes.io/name: pdftract-nightly-supply-chain
        workflow-type: nightly-supply-chain

    podSpecPatch: |
      imagePullSecrets:
        - name: docker-hub-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

    templates:
      - name: pipeline
        dag:
          failFast: false
          tasks:
            - name: setup
              template: setup
            - name: cargo-audit
              template: cargo-audit
              dependencies: [setup]
              continueOn:
                failed: true
                error: true
            - name: cargo-deny
              template: cargo-deny
              dependencies: [cargo-audit]
              continueOn:
                failed: true
                error: true
            - name: policy-gate
              template: policy-gate
              dependencies: [cargo-audit, cargo-deny]
              arguments:
                parameters:
                  - name: audit-status
                    value: "{{tasks.cargo-audit.status}}"
                  - name: deny-status
                    value: "{{tasks.cargo-deny.status}}"

      - name: setup
        activeDeadlineSeconds: 300
        container:
          image: alpine/git:2.43.0
          command: [sh, -c]
          args:
            - |
              set -eu
              rm -rf /workspace/* /workspace/.[!.]* /workspace/..?* 2>/dev/null || true
              git clone --depth 1 --branch main \
                https://git.ardenone.com/jedarden/pdftract.git /workspace
              printf 'source revision: %s\n' "$(git -C /workspace rev-parse HEAD)"
          env:
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: credential.helper
            - name: GIT_CONFIG_VALUE_0
              value: '!f() { test "$1" = get && echo "username=x-token" && echo "password=$FORGEJO_TOKEN"; }; f'
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-webhook-token
                  key: token
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

      - name: cargo-audit
        activeDeadlineSeconds: 1800
        container:
          image: rust:1.97-bookworm
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              cd /workspace
              export CARGO_HOME=/cache/cargo
              export PATH="$CARGO_HOME/bin:$PATH"
              mkdir -p "$CARGO_HOME/bin"
              cargo install cargo-audit --locked --version 0.22.2
              echo '=== cargo audit (RustSec database refresh) ==='
              cargo audit --format terminal
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: cargo-cache
              mountPath: /cache/cargo
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2500m
              memory: 4Gi

      - name: cargo-deny
        activeDeadlineSeconds: 1800
        container:
          image: rust:1.97-bookworm
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              cd /workspace
              export CARGO_HOME=/cache/cargo
              export PATH="$CARGO_HOME/bin:$PATH"
              mkdir -p "$CARGO_HOME/bin"
              cargo install cargo-deny --locked --version 0.20.2
              echo '=== cargo deny (licenses, bans, sources, advisories) ==='
              cargo deny check licenses bans sources advisories
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: cargo-cache
              mountPath: /cache/cargo
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2500m
              memory: 4Gi

      - name: policy-gate
        activeDeadlineSeconds: 120
        inputs:
          parameters:
            - name: audit-status
            - name: deny-status
        container:
          image: alpine:3.21
          command: [sh, -c]
          args:
            - |
              set -eu
              printf 'cargo-audit status: %s\n' '{{inputs.parameters.audit-status}}'
              printf 'cargo-deny status: %s\n' '{{inputs.parameters.deny-status}}'
              if [ '{{inputs.parameters.audit-status}}' != Succeeded ] || \
                 [ '{{inputs.parameters.deny-status}}' != Succeeded ]; then
                echo 'supply-chain policy gate failed' >&2
                exit 1
              fi
              echo 'supply-chain policy gate passed'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
