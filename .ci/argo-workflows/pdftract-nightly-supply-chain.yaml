# pdftract-nightly-supply-chain CronWorkflow
#
# Nightly dependency-policy scan for the Forgejo source of truth. The scan is
# intentionally independent of push CI: it refreshes RustSec and cargo-deny
# policy data daily so newly published advisories are visible even when the
# repository is quiet.
#
# The exit handler archives task logs and terminal evidence to the explicit
# Garage artifact location before pod garbage collection.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: pdftract-nightly-supply-chain
  namespace: argo-workflows
  labels:
    app.kubernetes.io/name: pdftract-nightly-supply-chain
    app.kubernetes.io/component: ci
    app.kubernetes.io/part-of: pdftract
spec:
  schedules:
    - "0 3 * * *" # Daily at 03:00 UTC, before the nightly fuzz run.
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 7
  workflowSpec:
    entrypoint: pipeline
    onExit: evidence-exit
    serviceAccountName: argo-workflow

    # Audit (1800s) + deny (1800s), with scheduling and image pull headroom.
    activeDeadlineSeconds: 5400

    # Keep pods through the exit handler and for a day of upload debugging.
    # The evidence artifact outlives both the pods and Workflow TTL.
    podGC:
      strategy: OnWorkflowCompletion
      deleteDelayDuration: 24h
    ttlStrategy:
      secondsAfterSuccess: 259200
      secondsAfterFailure: 604800
    # Each task clones into its own pod-local emptyDir. Run them sequentially
    # to keep their source builds from competing for cluster resources.
    parallelism: 1
    volumes:
      - name: workspace
        emptyDir:
          sizeLimit: 2Gi
      - name: cargo-cache
        emptyDir:
          sizeLimit: 8Gi
      - name: nightly-evidence-script
        configMap:
          name: pdftract-nightly-evidence
      - name: evidence-output
        emptyDir:
          sizeLimit: 4Gi

    podMetadata:
      labels:
        app.kubernetes.io/name: pdftract-nightly-supply-chain
        workflow-type: nightly-supply-chain

    podSpecPatch: |
      imagePullSecrets:
        - name: docker-hub-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # The single io1-60 node has much less disk than the dependable
      # compute1-8 class and evicted cargo-deny during the 2026-10-06 run.
      nodeSelector:
        servers.ngpc.rxt.io/class: ch.vs1.large-iad

    templates:
      - name: evidence-exit
        dag:
          tasks:
            - name: capture
              template: capture-evidence
            - name: prune
              template: prune-evidence
              dependencies: [capture]

      - name: capture-evidence
        activeDeadlineSeconds: 900
        container:
          image: python:3.13-slim-bookworm
          command: [python3, /opt/evidence/capture.py]
          args: ["{{workflow.name}}", "{{workflow.status}}", pdftract-nightly-supply-chain]
          volumeMounts:
            - name: nightly-evidence-script
              mountPath: /opt/evidence
            - name: evidence-output
              mountPath: /evidence
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        outputs:
          artifacts:
            - name: terminal-evidence
              path: /evidence
              artifactGC:
                strategy: Never
              archive:
                tar:
                  compressionLevel: 6
              s3:
                endpoint: needle-ci-artifacts-iad.argo-workflows.svc.cluster.local:3900
                bucket: needle-ci-artifacts
                region: garage
                insecure: true
                key: pdftract/nightly/pdftract-nightly-supply-chain/{{workflow.name}}/evidence.tgz
                accessKeySecret:
                  name: needle-ci-local-artifact-publisher
                  key: access-key
                secretKeySecret:
                  name: needle-ci-local-artifact-publisher
                  key: secret-key

      - name: prune-evidence
        activeDeadlineSeconds: 300
        container:
          image: docker.io/amazon/aws-cli:2.36.44
          command: [sh, -c]
          args:
            - |
              set -eu
              endpoint=http://needle-ci-artifacts-iad.argo-workflows.svc.cluster.local:3900
              bucket=needle-ci-artifacts
              prefix=pdftract/nightly/pdftract-nightly-supply-chain/
              current="${prefix}{{workflow.name}}/evidence.tgz"
              export AWS_ACCESS_KEY_ID="$READER_ACCESS_KEY_ID"
              export AWS_SECRET_ACCESS_KEY="$READER_SECRET_ACCESS_KEY"
              aws --endpoint-url="$endpoint" s3api head-object --bucket "$bucket" --key "$current" >/dev/null
              cutoff=$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%SZ')
              aws --endpoint-url="$endpoint" s3api list-objects-v2 --bucket "$bucket" --prefix "$prefix" \
                --query "Contents[?LastModified<='$cutoff'].Key" --output text |
                tr '\t' '\n' | while IFS= read -r key; do
                  [ -z "$key" ] && continue
                  [ "$key" = None ] && continue
                  [ "$key" = "$current" ] && continue
                  AWS_ACCESS_KEY_ID="$PUBLISHER_ACCESS_KEY_ID" \
                    AWS_SECRET_ACCESS_KEY="$PUBLISHER_SECRET_ACCESS_KEY" \
                    aws --endpoint-url="$endpoint" s3api delete-object --bucket "$bucket" --key "$key" >/dev/null
                done
              echo 'Nightly supply-chain evidence upload verified; objects older than 30 days pruned'
          env:
            - name: READER_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: needle-ci-local-artifact-reader
                  key: access-key
            - name: READER_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: needle-ci-local-artifact-reader
                  key: secret-key
            - name: PUBLISHER_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: needle-ci-local-artifact-publisher
                  key: access-key
            - name: PUBLISHER_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: needle-ci-local-artifact-publisher
                  key: secret-key
            - name: AWS_DEFAULT_REGION
              value: garage
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

      - name: pipeline
        dag:
          failFast: false
          tasks:
            - name: cargo-audit
              template: cargo-audit
              continueOn:
                failed: true
                error: true
            - name: cargo-deny
              template: cargo-deny
              dependencies: [cargo-audit]
              continueOn:
                failed: true
                error: true
            - name: policy-gate
              template: policy-gate
              dependencies: [cargo-audit, cargo-deny]
              arguments:
                parameters:
                  - name: audit-status
                    value: "{{tasks.cargo-audit.status}}"
                  - name: deny-status
                    value: "{{tasks.cargo-deny.status}}"

      - name: cargo-audit
        activeDeadlineSeconds: 1800
        initContainers:
          - name: clone-source
            image: alpine/git:2.43.0
            command: [sh, -c]
            args:
              - |
                set -eu
                git clone --depth 1 --branch main \
                  https://git.ardenone.com/jedarden/pdftract.git /workspace
                git -c safe.directory=/workspace -C /workspace rev-parse HEAD
            env:
              - name: GIT_CONFIG_COUNT
                value: "1"
              - name: GIT_CONFIG_KEY_0
                value: credential.helper
              - name: GIT_CONFIG_VALUE_0
                value: '!f() { test "$1" = get && echo "username=x-token" && echo "password=$FORGEJO_TOKEN"; }; f'
              - name: FORGEJO_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: forgejo-webhook-token
                    key: token
            volumeMounts:
              - name: workspace
                mountPath: /workspace
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: 1000m
                memory: 512Mi
                ephemeral-storage: 4Gi
        container:
          image: rust:1.97-bookworm
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              cd /workspace
              export CARGO_HOME=/cache/cargo
              export PATH="$CARGO_HOME/bin:$PATH"
              mkdir -p "$CARGO_HOME/bin"
              cargo install cargo-audit --locked --version 0.22.2
              echo '=== cargo audit (RustSec database refresh) ==='
              cargo audit --format terminal
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: cargo-cache
              mountPath: /cache/cargo
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: 1500m
              memory: 2Gi
              ephemeral-storage: 12Gi

      - name: cargo-deny
        activeDeadlineSeconds: 1800
        initContainers:
          - name: clone-source
            image: alpine/git:2.43.0
            command: [sh, -c]
            args:
              - |
                set -eu
                git clone --depth 1 --branch main \
                  https://git.ardenone.com/jedarden/pdftract.git /workspace
                git -c safe.directory=/workspace -C /workspace rev-parse HEAD
            env:
              - name: GIT_CONFIG_COUNT
                value: "1"
              - name: GIT_CONFIG_KEY_0
                value: credential.helper
              - name: GIT_CONFIG_VALUE_0
                value: '!f() { test "$1" = get && echo "username=x-token" && echo "password=$FORGEJO_TOKEN"; }; f'
              - name: FORGEJO_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: forgejo-webhook-token
                    key: token
            volumeMounts:
              - name: workspace
                mountPath: /workspace
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: 1000m
                memory: 512Mi
                ephemeral-storage: 4Gi
        container:
          image: rust:1.97-bookworm
          command: [bash, -c]
          args:
            - |
              set -euo pipefail
              cd /workspace
              export CARGO_HOME=/cache/cargo
              export PATH="$CARGO_HOME/bin:$PATH"
              mkdir -p "$CARGO_HOME/bin"
              cargo install cargo-deny --locked --version 0.20.2
              echo '=== cargo deny (licenses, bans, sources, advisories) ==='
              cargo deny check licenses bans sources advisories
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: cargo-cache
              mountPath: /cache/cargo
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 4Gi
            limits:
              cpu: 1500m
              memory: 2Gi
              ephemeral-storage: 12Gi

      - name: policy-gate
        activeDeadlineSeconds: 120
        inputs:
          parameters:
            - name: audit-status
            - name: deny-status
        container:
          image: alpine:3.21
          command: [sh, -c]
          args:
            - |
              set -eu
              printf 'cargo-audit status: %s\n' '{{inputs.parameters.audit-status}}'
              printf 'cargo-deny status: %s\n' '{{inputs.parameters.deny-status}}'
              if [ '{{inputs.parameters.audit-status}}' != Succeeded ] || \
                 [ '{{inputs.parameters.deny-status}}' != Succeeded ]; then
                echo 'supply-chain policy gate failed' >&2
                exit 1
              fi
              echo 'supply-chain policy gate passed'
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
